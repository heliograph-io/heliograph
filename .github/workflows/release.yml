name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag to build (for a dry run, without publishing)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Cross-compile and publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # For keyless signing. A job-level block REPLACES the workflow-level one,
      # so contents: write is repeated here rather than inherited.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # FULL HISTORY, because the site generator reads it. Every page's
          # `lastmod` is the commit date of its own source file, so on a
          # shallow clone every page would claim it changed today and the
          # sitemap would be uniformly wrong. `cmd/heliograph-site/main.go`
          # refuses to build rather than emit that, and the test gate below
          # runs `go test ./...`, which includes the site tests.
          #
          # This was missing and the release job could not run its own tests.
          # It was introduced with the site's lastmod work in 397c8f3, after
          # v0.3.2, and no tag was pushed between then and v0.4.0 - so the
          # first release to exercise it was the first one to fail, with
          # thirteen site tests reporting "the checkout is shallow" and every
          # publishing job skipped behind them. `validate.yml:22` had
          # fetch-depth: 0 the whole time, which is why nothing on a pull
          # request ever said so.
          fetch-depth: 0

      # PINNED TO THE PATCH, and check-latest dropped with it. '1.27' with
      # check-latest resolves to whatever 1.27.x exists on the morning the job
      # runs, and a Go patch release changes the compiler, so it changes the
      # bytes. The pin is go.mod's `go` directive; packaging/toolchain_test.go
      # fails the build if this line and that one disagree.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'

      - name: Tests must pass before anything is published
        # A release that was never tested is worse than no release: it carries
        # the authority of a version number.
        run: go test ./... -count=1

      - name: Build every artefact, through the script the documentation gives out
        # THE SAME FILE A STRANGER RUNS. The build loop used to be written out
        # here, and the documented reproduce command was written somewhere
        # else - so the two could differ by one flag, which is enough to make
        # every published hash wrong with no error anywhere saying so.
        #
        # packaging/reproduce.sh owns the flags, the toolchain pin and the
        # .mcpb bundles, and writes SHA256SUMS over the lot.
        env:
          TAG: ${{ github.ref_name }}
        run: packaging/reproduce.sh "$TAG" dist

      - name: And it is reproducible, which is the claim
        # Built again, in a different directory, from a copy with no .git in
        # it - the two conditions that broke reproducibility when this was
        # first measured. A release whose hashes cannot be reproduced must not
        # be published carrying a promise that they can.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/again
          tar -c --exclude=.git --exclude=dist . | tar -x -C /tmp/again
          ( cd /tmp/again && packaging/reproduce.sh "$TAG" /tmp/again-dist >/dev/null )
          if ! diff dist/SHA256SUMS /tmp/again-dist/SHA256SUMS; then
            echo "::error::the second build of the same source produced different bytes. The published checksums would be unreproducible."
            exit 1
          fi
          echo "two independent builds, identical SHA256SUMS"

      # SIGNING, AND IT HAS NEVER RUN. Written here so the next release signs;
      # nothing in this repository has produced a signature yet, and nothing
      # claims one has until a tag has been through this job.
      #
      # KEYLESS, so there is no private key. cosign gets a short-lived
      # certificate from Fulcio bound to this workflow's OIDC identity, uses it
      # once, and the certificate expires in ten minutes; the binding is
      # recorded in Rekor, the public transparency log. What a verifier checks
      # is therefore an IDENTITY - "signed by the release workflow of
      # heliograph-io/heliograph" - rather than "signed by a key some person holds".
      #
      # That is the honest answer to "document the signing key's provenance":
      # there is no key to have provenance. A long-lived key would need
      # generating on a machine, storing somewhere, rotating, and its custody
      # explaining, and every one of those is a thing to get wrong. The cost of
      # keyless is that verifying reaches Sigstore over the network, so it is
      # not an offline check; https://docs.heliograph.io/provenance says so.
      #
      # ONE SIGNATURE OVER SHA256SUMS, not one per artefact. SHA256SUMS already
      # binds every file, and `sha256sum -c` after verifying the signature is
      # the same guarantee for a twelfth of the assets.
      - name: Get cosign
        if: startsWith(github.ref, 'refs/tags/')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the checksums
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          # ONE SIGSTORE BUNDLE, NOT A DETACHED .sig AND .pem, and cosign v3
          # left no choice. This step asked for the v2 pair and v3.0.6 refused
          # the whole invocation:
          #
          #   Error: signing dist/SHA256SUMS: create bundle file: open : no
          #   such file or directory
          #
          # `--new-bundle-format` defaults to true in v3, which makes
          # `--output-certificate` a no-op and `--bundle` required. Setting
          # `--new-bundle-format=false` does not get the old behaviour back
          # either - v3.0.6 then refuses with "must provide
          # --new-bundle-format or --bundle where applicable". Checked against
          # the real binary rather than the release notes.
          #
          # This was v0.4.1's failure and it is the FIRST TIME THIS STEP HAS
          # EVER RUN. Nothing had been signed before, so nothing regressed:
          # the step was written against v2 semantics and the installer moved
          # to v3 underneath it while no tag was being pushed.
          #
          # The bundle carries the signature, the certificate and the
          # transparency-log entry in one file, which is also one fewer thing
          # for a verifier to fetch in the right order.
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.sigstore.json \
            dist/SHA256SUMS
          # Verified here, before publishing, because a signature nobody has
          # checked is a file. The identity asserted is this workflow at this
          # tag, which is exactly what a reader is told to check for.
          cosign verify-blob \
            --bundle dist/SHA256SUMS.sigstore.json \
            --new-bundle-format \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            dist/SHA256SUMS
          echo "SHA256SUMS signed and the bundle verifies against this workflow's identity"

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/*

  npm:
    name: Publish the npm wrapper
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      # OIDC, not a token. npm trusted publishing mints a short-lived
      # credential scoped to this workflow, which cannot be extracted or
      # reused, so there is no long-lived NPM_TOKEN in this repository's
      # secrets to leak or to remember to rotate.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer. Node 24 ships one, but
      # pinning the CLI as well means a runner image change cannot silently
      # drop us back to token auth.
      - name: npm new enough for OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - name: The package version must be the tag
        # The tag is the source of truth. packaging_test.go asserts these agree
        # at head; this asserts it again at the moment of publishing, because
        # the wrapper downloads a release named after its own version and a
        # mismatch here ships a package that 404s on install.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          got="$(node -p "require('./packaging/npm/package.json').version")"
          if [ "$want" != "$got" ]; then
            echo "::error::package.json is $got but the tag is $want. The published wrapper would download a release that does not exist."
            exit 1
          fi
          echo "version $got matches the tag"

      - name: Publish
        # No NODE_AUTH_TOKEN: the CLI detects the OIDC environment and uses it.
        # Provenance is attached by default under trusted publishing, so the
        # package carries a signed statement of which workflow built it.
        #
        # TRUSTED PUBLISHING IS BOUND TO A REPOSITORY, AND THIS REPOSITORY
        # MOVED. The trusted publisher for `@dbhq/heliograph` is configured on
        # npmjs.com against a GitHub owner, repository and workflow file, and
        # the OIDC token's `repository` claim is checked against it. That claim
        # said `dbhq-uk/heliograph` until the 2026-09-16 transfer and says
        # `heliograph-io/heliograph` now.
        #
        # If this step fails on an auth error, that is why, and the
        # fix is on npmjs.com rather than here: Package settings, Trusted
        # publisher, change the repository to `heliograph-io/heliograph`. There
        # is no API and no secret to add - the whole point of OIDC is that
        # there is nothing here to change.
        working-directory: packaging/npm
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          # ALREADY PUBLISHED IS A SUCCESS, NOT A CONFLICT, and this exists so
          # that a release can be re-run. npm versions are immutable, so if
          # this exact version is already on the registry there is nothing a
          # second publish could do but fail with EPUBLISHCONFLICT and take
          # every job that needs this one down with it.
          #
          # v0.4.2 is why. Its publish SUCCEEDED and the step after it timed
          # out waiting for propagation, so the job was red with the package
          # live. Re-running could never go green: the first thing it did was
          # try to publish a version that now existed. The MCP registry job
          # `needs` this one, so an entry nobody could publish was stuck
          # behind a step that had already done its work.
          if npm view "@dbhq/heliograph@${ver}" version >/dev/null 2>&1; then
            echo "@dbhq/heliograph@${ver} is already on the registry, so this is a re-run. Not republishing."
          else
            npm publish --access public
          fi

      - name: It installs from the registry
        # Publishing is not the same as working. This installs the package the
        # way a user would, from the registry, and runs it - which exercises
        # the postinstall download and the checksum check against the release
        # the previous job just published.
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          npm init -y >/dev/null
          ver="${GITHUB_REF_NAME#v}"

          # npm accepts a publish before the version is resolvable for install.
          # The first run of this step failed with ETARGET seconds after a
          # publish that had plainly succeeded, so it waits rather than calling
          # a propagation delay a failed release.
          #
          # It still fails in the end: a version that never becomes installable
          # is a broken release, and the difference between that and slow is
          # only how long you are willing to wait for it.
          #
          # FIFTEEN MINUTES, NOT FIVE. v0.4.2 published successfully and was
          # still not installable when the twentieth attempt ran out, so the
          # job went red over a package that was live. Installing it by hand a
          # few minutes later worked first time, including the binary download
          # and its checksum verification. Five minutes was a guess; this is a
          # measured correction rather than a larger guess, and the number is
          # now big enough that exceeding it means something is actually wrong.
          deadline=$(( SECONDS + 900 ))
          attempt=0
          until npm install "@dbhq/heliograph@${ver}" 2>/dev/null; do
            attempt=$(( attempt + 1 ))
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::@dbhq/heliograph@${ver} was published but is still not installable after 15 minutes and ${attempt} attempts"
              exit 1
            fi
            echo "not installable yet, ${attempt} attempts, $(( deadline - SECONDS ))s left"
            sleep 15
          done
          echo "installed after ${attempt} failed attempts"
          ./node_modules/.bin/heliograph version
          printf '{"jsonrpc":"2.0","id":1,"method":"tools/list"}\n' \
            | ./node_modules/.bin/heliograph mcp \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const t=JSON.parse(s).result.tools;if(t.length!==7){console.error('::error::got '+t.length+' tools, want 7');process.exit(1)}console.log('installed from npm and served '+t.length+' tools')})"

  registry:
    name: Publish to the MCP registry
    # After npm, not beside it. The registry entry tells a client to install
    # @dbhq/heliograph at this version, so publishing it before npm has the
    # package advertises an install that fails for as long as the gap lasts.
    needs: npm
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      # OIDC again, and for a sharper reason than convenience. The registry
      # decides what you may publish from who you are: a GitHub user token
      # only carries `io.github.<user>/*` unless it can also read the org, so
      # the first publish of `io.github.dbhq-uk/heliograph` was refused with a
      # 403 naming the personal namespace. An Actions OIDC token proves the
      # repository, and the repository is the organisation's, so the namespace
      # follows from it. No PAT, and nothing to rotate.
      #
      # THE OLD NAME IS LEFT IN THAT SENTENCE ON PURPOSE. It is what was
      # refused, in 2026-09, when the repository was `dbhq-uk/heliograph`. The
      # namespace this workflow publishes today is
      # `io.github.heliograph-io/heliograph`, and it followed the transfer for
      # exactly the reason the sentence gives: OIDC proves the repository, so
      # nobody had to choose it.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'

      - name: Get the publisher
        # Pinned. `@latest` in a release job means the tool that publishes can
        # change between two releases with nothing in this repository moving.
        run: go install github.com/modelcontextprotocol/registry/cmd/publisher@v1.8.1

      - name: server.json must be the tag
        # Same reasoning as the npm job above. The registry entry names a
        # package version; if it names one the release did not produce, every
        # client that follows the listing installs nothing.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          got="$(jq -r .version server.json)"
          if [ "$want" != "$got" ]; then
            echo "::error::server.json is $got but the tag is $want. The registry would advertise a version that was never released."
            exit 1
          fi
          echo "server.json is $got, matching the tag"

      - name: Publish
        run: |
          set -euo pipefail
          publisher login github-oidc
          publisher publish

      - name: The registry serves what we published
        # Publishing is not the same as listed. This asks the registry the
        # question a client asks, and fails if the answer is the old version.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          want="${TAG#v}"
          for attempt in $(seq 1 10); do
            # Matched by name, not by taking the first result: "heliograph" is
            # a word somebody else may publish under, and the 19th-century
            # mirror gives them every reason to.
            got="$(curl -sS 'https://registry.modelcontextprotocol.io/v0/servers?search=heliograph' \
              | jq -r '[.servers[].server | select(.name == "io.github.heliograph-io/heliograph")][0].version // ""')"
            if [ "$got" = "$want" ]; then
              echo "the registry serves $got"
              exit 0
            fi
            sleep 10
          done
          echo "::error::the registry still serves '${got}', not ${want}"
          exit 1

  image:
    name: Publish the container image
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # For the build provenance attestation, which is what lets somebody
      # verify this image came from this workflow and not from a laptop.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          # arm64 as well as amd64: an Apple laptop and a Graviton box are both
          # ordinary places to run this, and an amd64-only image emulates on
          # both, slowly and silently.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: |
            ghcr.io/heliograph-io/heliograph:${{ github.ref_name }}
            ghcr.io/heliograph-io/heliograph:latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ghcr.io/heliograph-io/heliograph
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: It answers introspection
        # The Dockerfile's header tells people to run this image. Publishing one
        # that starts and then does nothing useful would make that a lie in a
        # more expensive way than not publishing at all.
        run: |
          set -euo pipefail
          out="$(printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | docker run -i --rm "ghcr.io/heliograph-io/heliograph:${GITHUB_REF_NAME}")"
          echo "$out"
          n="$(printf '%s' "$out" | grep -c '"name":"heliograph_' || true)"
          if [ "$n" -lt 1 ]; then
            echo "::error::the published image did not list its tools"
            exit 1
          fi
          echo "the published image serves its tools"

      - name: A STRANGER can pull it, which the step above does not prove
        # The introspection test runs `docker run` inside this job, which is
        # still logged in from `docker/login-action`. It therefore passes just
        # as happily on a PRIVATE package, and a private package is the DEFAULT
        # for a container GitHub Packages has not seen before.
        #
        # That matters now rather than in the abstract. The 2026-09-16 transfer
        # to `heliograph-io` did NOT bring the package with it: on 2026-09-17
        # `ghcr.io/dbhq-uk/heliograph` still answered an anonymous manifest
        # request with 200 and `ghcr.io/heliograph-io/heliograph` answered 403,
        # because the latter did not exist. So the first release under the new
        # org creates a new package, and nothing else here would notice if it
        # came out private.
        #
        # Every `docker run` in the README, the Dockerfile header and
        # `site/content/containers.md` is written for somebody who has not
        # logged in to ghcr.io and never will. This asks the question they ask.
        run: |
          set -euo pipefail
          img="heliograph-io/heliograph"
          tok="$(curl -sS "https://ghcr.io/token?scope=repository:${img}:pull&service=ghcr.io" | jq -r '.token // empty')"
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${tok}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://ghcr.io/v2/${img}/manifests/${GITHUB_REF_NAME}")"
          if [ "$code" != "200" ]; then
            echo "::error::ghcr.io/${img}:${GITHUB_REF_NAME} is not anonymously pullable (HTTP ${code}). The package is private, so every documented docker run fails for everybody but us. Make it public at https://github.com/organizations/heliograph-io/settings/packages - Package creation, tick Public. NOT the package own settings page: that greys Public out with 'Setting is disabled by organization administrators' because the org forbids public packages, and no amount of typing the package name into its confirm box changes that. Neither setting has a REST endpoint, so this one is a person."
            exit 1
          fi
          echo "anonymous pull of ghcr.io/${img}:${GITHUB_REF_NAME} returns 200"

  winget:
    name: Submit to winget
    # After build, beside npm rather than behind it: the manifest points at
    # the two Windows executables the build job just published, and needs
    # nothing from npm or the registry.
    #
    # SUBMIT, NOT PUBLISH. winget has no registry to push to. A package is a
    # pull request to microsoft/winget-pkgs holding three YAML files, and it
    # is installable only once a moderator has merged it, which is hours on a
    # good day. So this job opens the PR and stops; the release is complete
    # before it runs and does not wait for it.
    #
    # PORTABLE, which is winget's word for a bare executable that gets a
    # symlink on PATH. No installer is built, no zip, no MSI: the URL in the
    # manifest is the same heliograph-windows-amd64.exe a stranger downloads
    # from the release page, and the hash winget checks before running it is
    # the number in SHA256SUMS. That is the point. An installer would be a
    # second artefact, built by a second tool, with a second hash that
    # packaging/reproduce.sh does not produce.
    #
    # NO KOMAC, and it was the first design. `komac update` refuses a package
    # that is not in winget-pkgs yet, and `komac new` stops at a prompt no
    # flag suppresses, so neither could make the first submission from here.
    # packaging/winget/manifests.sh writes the three files from SHA256SUMS
    # and this job pushes them through the GitHub API. No clone: winget-pkgs
    # is hundreds of thousands of files, and three PUTs are three requests.
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Write the manifests from the release's own checksums
        # SHA256SUMS is fetched from the release just published, the same
        # way a stranger gets it, rather than passed from the build job. It
        # is the file cosign signed, so the hash winget checks is the hash
        # anybody can verify.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -O SHA256SUMS
          packaging/winget/manifests.sh "$TAG" SHA256SUMS winget
          cat winget/manifests/h/heliograph-io/heliograph/*/heliograph-io.heliograph.installer.yaml

      - name: Open the pull request on winget-pkgs
        # THE ONE LONG-LIVED CREDENTIAL IN THIS FILE, and why. npm and the MCP
        # registry accept an Actions OIDC token, so those jobs hold nothing.
        # winget-pkgs is Microsoft's repository, the submission is a PR from a
        # fork, and GitHub gives a workflow no identity that can push to a
        # fork it does not own. Opening a PR on a repository you do not own
        # needs a classic personal access token with `public_repo`; a
        # fine-grained token cannot (russellbanks/Komac#310 is the same wall,
        # hit by a different tool).
        #
        # `public_repo` on a person's account can write to every public
        # repository that person can, including this one. So WINGET_TOKEN
        # belongs to a separate account that owns nothing but its fork of
        # winget-pkgs and is a member of no organisation. What the token can
        # reach if it leaks is that fork. That account signs Microsoft's CLA
        # once, on its first PR, by replying to the bot that asks.
        #
        # Skipped, loudly, when the secret is absent. A release that reached
        # GitHub, npm, the registry and ghcr.io is not broken because winget
        # did not hear about it, and failing this job would say it was.
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::WINGET_TOKEN is not set, so ${TAG} was not submitted to winget. Add the secret and re-run this job. The manifests are in this job's log above."
            exit 0
          fi
          id="heliograph-io.heliograph"
          ver="${TAG#v}"
          path="manifests/h/heliograph-io/heliograph/${ver}"
          bot="$(gh api user --jq .login)"
          branch="${id}-${ver}"

          # The fork, created if the account has none, then brought level
          # with upstream so the branch starts from today's master and the
          # PR carries three files rather than a month of other people's.
          gh repo fork microsoft/winget-pkgs --clone=false
          gh api -X POST "repos/${bot}/winget-pkgs/merge-upstream" -f branch=master >/dev/null
          base="$(gh api "repos/${bot}/winget-pkgs/git/ref/heads/master" --jq .object.sha)"
          gh api -X DELETE "repos/${bot}/winget-pkgs/git/refs/heads/${branch}" >/dev/null 2>&1 || true
          gh api -X POST "repos/${bot}/winget-pkgs/git/refs" -f ref="refs/heads/${branch}" -f sha="$base" >/dev/null

          # New package or update decides the title winget-pkgs asks for.
          if gh api "repos/microsoft/winget-pkgs/contents/manifests/h/heliograph-io/heliograph" >/dev/null 2>&1; then
            title="Update: ${id} to ${ver}"
          else
            title="New package: ${id} version ${ver}"
          fi

          for f in "winget/${path}"/*.yaml; do
            gh api -X PUT "repos/${bot}/winget-pkgs/contents/${path}/$(basename "$f")" \
              -f message="$title" -f branch="$branch" -f content="$(base64 -w0 "$f")" >/dev/null
          done

          gh pr create -R microsoft/winget-pkgs --head "${bot}:${branch}" --title "$title" --body "$(cat <<EOF
          ## Description

          ${title}. A portable (bare executable) package for the heliograph CLI, generated by the release workflow of https://github.com/${GITHUB_REPOSITORY} from the release's published SHA256SUMS: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}

          Generated by \`packaging/winget/manifests.sh\` at https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/packaging/winget/manifests.sh

          ## Checklist

          - [x] Signed the [Contributor License Agreement](https://cla.opensource.microsoft.com)
          - [ ] Linked to an issue (if applicable)

          ## Manifest Checklist

          - [x] Checked that there aren't other open [pull requests](https://github.com/microsoft/winget-pkgs/pulls) for the same manifest update/change
          - [x] This PR only modifies one (1) manifest
          - [x] Validated manifest against the 1.12 schema
          - [ ] Tested manifest locally with \`winget install --manifest <path>\` (generated on Linux by a release workflow; the portable installer is a bare executable)
          - [x] Manifest conforms to the [1.12 schema](https://github.com/microsoft/winget-pkgs/tree/master/doc/manifest/schema/1.12.0)
          EOF
          )"
