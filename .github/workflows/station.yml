name: station

# The station's own CI, carried over from dbhq-uk/heliograph-skill in the
# 2026-09-08 merge with paths repointed at station/. The Go side is
# validate.yml; this file is everything that proves the far side.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate plugin manifest is valid JSON
        run: jq empty .claude-plugin/plugin.json

      - name: Check shell scripts parse
        # Root installers included: a syntax error there breaks every install.
        # tests/ included too. The tests job runs those scripts, so a syntax
        # error there does get caught - but as a failing test run in a different
        # job, which reads as "the station is broken" rather than "this file
        # does not parse". Same corpus as AGENTS.md's local command.
        run: |
          fail=0
          while IFS= read -r s; do
            bash -n "$s" || { echo "Syntax error: $s"; fail=1; }
          done < <({ find . -maxdepth 1 -name '*.sh'; find skills station tests -name '*.sh'; })
          exit $fail

      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning $(find . -name '*.sh' -not -path './.git/*' -not -path './site/*')

      - name: Check SKILL.md frontmatter
        run: |
          python3 - <<'PY'
          import sys, pathlib, re
          ok = True
          for skill in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = skill.read_text(encoding="utf-8")
              m = re.match(r"^---\n(.*?)\n---", text, re.S)
              if not m:
                  print(f"{skill}: missing YAML frontmatter"); ok = False; continue
              fm = m.group(1)
              name = re.search(r"^name:\s*(.+)$", fm, re.M)
              desc = re.search(r"^description:\s*(.+)$", fm, re.M)
              if not name:
                  print(f"{skill}: missing 'name'"); ok = False
              else:
                  name = name.group(1).strip()
                  if name != skill.parent.name:
                      print(f"{skill}: name '{name}' != directory '{skill.parent.name}'"); ok = False
                  if not re.fullmatch(r"[a-z0-9-]{1,64}", name):
                      print(f"{skill}: name must be lowercase alphanumeric/hyphen, <=64 chars"); ok = False
              if not desc:
                  print(f"{skill}: missing 'description'"); ok = False
              elif len(desc.group(1).strip()) > 1024:
                  print(f"{skill}: description exceeds 1024 chars"); ok = False
          sys.exit(0 if ok else 1)
          PY

      # The whole install story rests on ${CLAUDE_SKILL_DIR} being substituted
      # where it is used at all. A hardcoded ~/.claude/skills path works on the
      # author's machine and is wrong under both a Codex and a plugin install.
      - name: No hardcoded install paths
        run: |
          if grep -rn '~/\.claude/skills\|\$HOME/\.claude/skills' skills/; then
            echo "::error::Hardcoded install path found. Use \${CLAUDE_SKILL_DIR} instead."
            exit 1
          fi
          echo "No hardcoded install paths."

      # Every rule this skill teaches about not truncating a diagnostic applies
      # to the station itself, and `probe` lines are where that rule bites: what
      # a probe prints IS the evidence, so a `head` there cuts the line someone
      # needed and the loss is invisible in the log.
      - name: Probes do not truncate their own evidence
        run: |
          hits=$(grep -nE '^[[:space:]]*probe(_opt)? .*\|[[:space:]]*(head|tail)\b' \
                 station/bash/steps/*.sh || true)
          # The same rule, in PowerShell, where truncation has different names.
          # `Select-Object -First/-Last` and `Out-String` without -Width are the
          # two that cut evidence silently: the first drops rows, the second
          # wraps at the host width and puts `...` in the middle of a value.
          # Out-String -Width IS allowed and is used deliberately, which is why
          # the pattern insists on its absence.
          hits="$hits$(grep -nE 'Select-Object[[:space:]]+-(First|Last)\b' \
                 station/powershell/steps/*.ps1 2>/dev/null || true)"
          hits="$hits$(grep -nE 'Out-String([[:space:]]*\||[[:space:]]*$)' \
                 station/powershell/steps/*.ps1 2>/dev/null || true)"
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::A probe truncates its own output. See references/method.md rule 4."
            exit 1
          fi
          echo "No truncated probes."

  installers:
    name: Installers actually install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Claude install
        run: |
          ./install.sh
          test -L "$HOME/.claude/skills/heliograph" || { echo "not a symlink"; exit 1; }
          test -f "$HOME/.claude/skills/heliograph/SKILL.md" || { echo "SKILL.md missing"; exit 1; }

      - name: Codex install, and the rewritten paths resolve
        run: |
          ./install-codex.sh
          target="$HOME/.codex/skills/heliograph"
          test -f "$target/SKILL.md" || { echo "SKILL.md missing"; exit 1; }
          grep -q 'CLAUDE_SKILL_DIR' "$target/SKILL.md" && { echo "variable not substituted"; exit 1; }
          test -d "$target/references" || { echo "references/ not linked"; exit 1; }
          # Every path the rewritten SKILL.md names must exist on disk.
          fail=0
          while IFS= read -r p; do
            [ -e "$p" ] || { echo "rewritten path does not exist: $p"; fail=1; }
          done < <(grep -o "$target[^ \`\"']*" "$target/SKILL.md" | sort -u)
          exit $fail

      - name: No dangling symlinks after either install
        run: |
          found=$(find "$HOME/.claude/skills/heliograph/" "$HOME/.codex/skills/heliograph/" -xtype l 2>/dev/null || true)
          if [ -n "$found" ]; then echo "::error::dangling symlinks:"; echo "$found"; exit 1; fi
          echo "No dangling symlinks."

  # SKILL.md's install command is run verbatim by an agent, on whatever machine
  # it happens to be on. It used to fetch heliograph-linux-amd64 everywhere,
  # which installs and chmods perfectly on an Apple Silicon Mac and then fails
  # with "exec format error". Only running it on the other platform shows that,
  # so it is run on each, against the real latest release, and the binary it
  # installed has to run. The offline half (every platform faked, checksums
  # that do and do not match) is in the `tests` job; it runs here on macOS too,
  # because that is where `shasum` stands in for `sha256sum`.
  binary-install:
    name: The skill's install command installs a binary that runs (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Offline, against fixtures, on macOS
        if: runner.os == 'macOS'
        run: ./tests/test-skill-install.sh

      - name: The real release, and the installed binary runs
        run: ./tests/test-skill-install.sh --live

  station:
    name: The station captures a run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The one thing worth exercising end to end. A capture that loses the
      # timestamps, swallows an exit code, or writes nothing on failure is the
      # failure mode this whole repo exists to avoid, and it is invisible until
      # someone is waiting on the far side of a gap for a log that never comes.
      - name: Bootstrap into a fresh repo
        run: |
          ./station/bootstrap.sh /tmp/transport
          cd /tmp/transport
          test -f .gitignore || { echo "gitignore not installed as .gitignore"; exit 1; }
          test ! -e gitignore || { echo "undotted gitignore left behind"; exit 1; }
          git init -q && git add -A && git -c user.email=ci@example.com -c user.name=ci commit -qm init

      - name: A passing step is captured, timestamped and complete
        run: |
          cd /tmp/transport
          PUSH=0 ./run.sh env
          log=$(ls -t ops-logs/env-*.txt | head -1)
          grep -q 'git commit  :' "$log" || { echo "header missing provenance"; exit 1; }
          grep -q 'RESULT       : ' "$log" || { echo "footer missing"; exit 1; }
          # Every captured line carries a UTC clock. Header and footer are
          # written outside cap_run and are exempt; the body is not.
          bad=$(sed -n '/^---------- /,$p' "$log" \
                | grep -vE '^[0-9]{2}:[0-9]{2}:[0-9]{2} \| |^$|^-{5}|^={5}| finished UTC | exit code | RESULT ' \
                | head -5)
          if [ -n "$bad" ]; then echo "untimestamped lines:"; echo "$bad"; exit 1; fi

      - name: A failing step still produces a log and the real exit code
        run: |
          cd /tmp/transport
          printf '#!/usr/bin/env bash\n# heliograph-mode: read-only\nset -uo pipefail\necho "this step fails"\nexit 7\n' > steps/boom.sh
          chmod +x steps/boom.sh
          sed -i 's|^  net)|  boom) CMD=(./steps/boom.sh) ;;\n  net)|' run.sh
          set +e; PUSH=0 ./run.sh boom; rc=$?; set -e
          [ "$rc" = "7" ] || { echo "expected exit 7, got $rc"; exit 1; }
          log=$(ls -t ops-logs/boom-*.txt | head -1)
          grep -q 'exit code    : 7' "$log" || { echo "footer lost the exit code"; exit 1; }
          grep -q 'RESULT       : FAILED' "$log" || { echo "footer did not mark failure"; exit 1; }

      - name: An unknown step exits 2 having done nothing
        run: |
          cd /tmp/transport
          before=$(ls ops-logs | wc -l)
          set +e; PUSH=0 ./run.sh nosuchstep >/dev/null 2>&1; rc=$?; set -e
          [ "$rc" = "2" ] || { echo "expected exit 2, got $rc"; exit 1; }
          [ "$(ls ops-logs | wc -l)" = "$before" ] || { echo "an unknown step wrote a log"; exit 1; }

      # A step says what it is in its own file, and the runner gates on that
      # rather than on the step's name. Both halves are exercised here because
      # both are refusals, and a refusal that silently stopped happening would
      # look exactly like a clean run.
      - name: A step declaring itself an action refuses without CONFIRM
        run: |
          cd /tmp/transport
          printf '#!/usr/bin/env bash\n# heliograph-mode: action\necho "changes something"\n' > steps/act.sh
          chmod +x steps/act.sh
          sed -i 's|^  boom)|  apply) CMD=(./steps/act.sh) ;;\n  boom)|' run.sh
          set +e; PUSH=0 ./run.sh apply >/dev/null 2>&1; rc=$?; set -e
          [ "$rc" = "3" ] || { echo "a state-changing step ran without CONFIRM=yes (exit $rc)"; exit 1; }
          set +e; CONFIRM=yes PUSH=0 ./run.sh apply >/dev/null 2>&1; rc=$?; set -e
          [ "$rc" = "0" ] || { echo "CONFIRM=yes did not let the action through (exit $rc)"; exit 1; }

      - name: A step that declares nothing does not run at all
        run: |
          cd /tmp/transport
          printf '#!/usr/bin/env bash\necho "no declaration here"\n' > steps/undeclared.sh
          chmod +x steps/undeclared.sh
          sed -i 's|^  boom)|  undeclared) CMD=(./steps/undeclared.sh) ;;\n  boom)|' run.sh
          before=$(ls ops-logs | wc -l)
          set +e; out=$(PUSH=0 ./run.sh undeclared 2>&1); rc=$?; set -e
          [ "$rc" = "3" ] || { echo "an undeclared step was not refused (exit $rc)"; exit 1; }
          [ "$(ls ops-logs | wc -l)" = "$before" ] || { echo "an undeclared step wrote a log"; exit 1; }
          case "$out" in *heliograph-mode:*) ;; *) echo "the refusal did not say what to add"; exit 1 ;; esac

      - name: The runner refuses to run as root
        run: |
          cd /tmp/transport
          mkdir -p /tmp/fakebin
          printf '#!/bin/sh\n[ "$1" = "-u" ] && { echo 0; exit 0; }\nexec /usr/bin/id "$@"\n' > /tmp/fakebin/id
          chmod +x /tmp/fakebin/id
          set +e; PATH=/tmp/fakebin:$PATH PUSH=0 ./run.sh env >/dev/null 2>&1; rc=$?; set -e
          [ "$rc" = "5" ] || { echo "expected the root refusal (exit 5), got $rc"; exit 1; }
          set +e; PATH=/tmp/fakebin:$PATH ALLOW_ROOT=1 PUSH=0 ./run.sh env >/dev/null 2>&1; rc=$?; set -e
          [ "$rc" = "0" ] || { echo "ALLOW_ROOT=1 did not permit the run (exit $rc)"; exit 1; }

  tests:
    name: Station unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The relay is the one transport whose far side is a program, and the
      # conformance suite builds heliograph-seal from this tree to talk to a
      # stub relay. Without a toolchain the driver skips the relay - correct on
      # a machine that has no Go, and exactly the wrong thing to let pass here.
      # Pinned to go.mod so the seal under test is built the way it ships.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Assertions under tests/
        run: ./tests/run-tests.sh

      # Run again, alone, and refuse a skip. A skip inside run-tests.sh is a
      # line in a thousand and nobody reads it; here it is the finding. This is
      # what stops "the conformance suite passes over every transport" quietly
      # becoming "over the two that need nothing installed".
      - name: The conformance suite ran over every transport, unskipped
        run: |
          set +e
          ./tests/test-conformance.sh 2>&1 | tee /tmp/conformance.out
          rc="${PIPESTATUS[0]}"
          set -e
          [ "$rc" -eq 0 ] || { echo "::error::tests/test-conformance.sh failed"; exit 1; }
          if grep -q '^SKIP' /tmp/conformance.out; then
            echo "::error::the conformance suite skipped a transport instead of running it."
            exit 1
          fi
          for t in git share relay; do
            grep -q "passes the conformance suite over $t" /tmp/conformance.out || {
              echo "::error::the suite did not run over $t"; exit 1; }
          done

  # tests/test-container.sh builds the image from station/bash/docker/Dockerfile
  # as its own first step, and it is already part of the sweep the `tests` job
  # runs. That alone is not enough: test-container.sh SKIPS LOUDLY, not fails,
  # when no container runtime is reachable - the right behaviour on a developer
  # laptop, and exactly the wrong one to let pass unnoticed in CI. A green
  # `tests` job in which it quietly skipped would read identically to one where
  # every property was verified. This job refuses the skip, as its own named
  # check. GitHub-hosted ubuntu-latest runners ship Docker with the daemon
  # running, so the skip path firing here is itself the finding.
  container:
    name: Container image builds, and its tests run unskipped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run tests/test-container.sh and refuse a silent skip
        run: |
          set +e
          ./tests/test-container.sh 2>&1 | tee /tmp/test-container.out
          rc="${PIPESTATUS[0]}"
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::tests/test-container.sh failed (exit $rc)"
            exit 1
          fi
          if grep -q '^SKIP' /tmp/test-container.out; then
            echo "::error::tests/test-container.sh skipped something instead of running it."
            exit 1
          fi
          if ! grep -qE '^test-container\.sh: [0-9]+ passed, [0-9]+ failed, 0 skipped$' /tmp/test-container.out; then
            echo "::error::tests/test-container.sh did not report '0 skipped'."
            exit 1
          fi

  # The same argument as the container job. tests/test-powershell.sh skips its
  # ps_step half when no PowerShell is on PATH, which is right on a Linux
  # developer box and wrong to let pass here. It matters more than usual
  # because NOTHING ELSE in this job's corpus reads a .ps1 at all: bash -n and
  # shellcheck sweep *.sh and step straight over station.ps1. A syntax error
  # in one would go green here and only surface on a Windows control node,
  # which is the one machine nobody can log in to.
  powershell:
    name: PowerShell parses, and its tests run unskipped
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # .psm1 AS WELL AS .ps1, and the modules are where nearly all of it lives:
      # caplib.psm1, every transport, the cancel, the seal. `-Filter *.ps1` does
      # NOT match them - measured, 14 .ps1 and 8 .psm1, and the eight had never
      # been parsed by anything in CI. They all parse today, which is the only
      # reason widening this is a one-line change rather than a day.
      - name: Every .ps1 and .psm1 in the station parses
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path station,tests,skills -Include *.ps1,*.psm1 -Recurse -File)
          if ($files.Count -eq 0) {
            Write-Output "::error::no PowerShell files found, so this job checked nothing"
            exit 1
          }
          # A FLOOR, because -Include silently matching nothing is exactly the
          # failure this job is for. The count only goes up.
          if ($files.Count -lt 20) {
            Write-Output "::error::only $($files.Count) PowerShell files found; the pattern has stopped matching"
            exit 1
          }
          $bad = 0
          foreach ($f in $files) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $f.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $bad++
              foreach ($e in $errors) {
                Write-Output "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            } else {
              Write-Output "ok   $($f.FullName)"
            }
          }
          Write-Output "$($files.Count) file(s) parsed, $bad bad"
          exit $bad

      - name: Run tests/test-powershell.sh and refuse a silent skip
        run: |
          set +e
          ./tests/test-powershell.sh 2>&1 | tee /tmp/test-powershell.out
          rc="${PIPESTATUS[0]}"
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::tests/test-powershell.sh failed (exit $rc)"
            exit 1
          fi
          if grep -q '^SKIP' /tmp/test-powershell.out; then
            echo "::error::tests/test-powershell.sh skipped something instead of running it."
            exit 1
          fi
          if ! grep -qE '^test-powershell\.sh: [0-9]+ passed, [0-9]+ failed, 0 skipped$' /tmp/test-powershell.out; then
            echo "::error::tests/test-powershell.sh did not report '0 skipped'."
            exit 1
          fi
          if grep -q 'SKIPPING every PowerShell assertion' /tmp/test-powershell.out; then
            echo "::error::tests/test-powershell.sh found no PowerShell interpreter and skipped its ps_step half."
            exit 1
          fi

      # THE SEAL, ON LINUX, WHICH IS THE POINT OF CHOOSING MANAGED CODE.
      #
      # The relay's crypto could have been Windows CNG. It is not, so all four
      # primitives are checkable on an ordinary runner against the RFCs' own
      # vectors, and the whole construction against Go's own bytes - hours
      # before anybody waits on a Windows job.
      #
      # The dotnet SDK is here for the C# 5 / net48 build. That is the one
      # thing a Linux runner cannot infer: pwsh 7 compiles this tree with
      # Roslyn against .NET 10 and would accept a Span<T> that Windows
      # PowerShell 5.1's CodeDOM compiler refuses.
      # Go, for the CONTROL side of the relay harness only. The station side
      # is the thing under test and has no binary; heliograph-seal is what
      # makes the keys and reads the delivery back.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '8.0'

      - name: The seal agrees with Go, and compiles as C# 5
        run: |
          set +e
          ./tests/test-seal-ps1.sh 2>&1 | tee /tmp/seal.out
          rc="${PIPESTATUS[0]}"
          set -e
          [ "$rc" -eq 0 ] || { echo "::error::tests/test-seal-ps1.sh failed (exit $rc)"; exit 1; }
          # NOTHING MAY SKIP HERE. Both halves are the reason the job exists,
          # and each one skips silently when its tool is absent - which on a
          # runner is never a legitimate reason.
          if grep -q '^SKIP' /tmp/seal.out; then
            echo "::error::the seal skipped something instead of running it:"
            grep '^SKIP' /tmp/seal.out
            exit 1
          fi
          # Named, not counted. These four are the assertions that would still
          # leave dozens of passes behind if they quietly stopped running.
          #
          # COPIED FROM THE TEST'S OWN OUTPUT, not paraphrased. The first
          # version of this list looked for `opens Go`, and the line says
          # `it opens what Go sealed` - so the job failed with "the seal did
          # not assert" on a run in which all 26 assertions had passed. A guard
          # that quotes a string nothing prints is a guard that only ever
          # fails.
          for want in \
            'compiles as C# 5 against net48' \
            'opens what Go sealed' \
            'produces what Go would have sealed, byte for byte' \
            'refuses a message forwarded to a third party' \
            'three distinct sequence numbers'; do
            grep -qF "$want" /tmp/seal.out || {
              echo "::error::the seal did not assert: $want"; exit 1; }
          done

      - name: Conformance over the relay, with no binary on the station side
        run: |
          set +e
          CONF_TRANSPORT=relay timeout 900 ./tests/conformance/conformance.sh \
            tests/conformance/drivers/powershell.sh 2>&1 | tee /tmp/relay-conf.out
          rc="${PIPESTATUS[0]}"
          set -e
          [ "$rc" -eq 0 ] || { echo "::error::relay conformance failed"; exit 1; }
          # p9 IS THE ONE THAT MATTERS: the station sealed with lib/seal.psm1
          # and the control side opened it with Go. Nothing else compares the
          # two implementations end to end.
          grep -qE '^ok +p9:' /tmp/relay-conf.out || {
            echo "::error::the PowerShell station did not deliver over the relay"; exit 1; }
          if grep -q '^SKIP' /tmp/relay-conf.out; then
            echo "::error::relay conformance skipped something:"; grep '^SKIP' /tmp/relay-conf.out; exit 1
          fi

  # The parts that ONLY exist on Windows: station.ps1's registry lookup for
  # bash, ps_step against Windows PowerShell 5.1 rather than pwsh 7, the
  # line-ending probe's CR-tolerant branch, and .gitattributes against a real
  # core.autocrlf=true. This repo is public, so windows-latest costs nothing.
  windows:
    name: The station runs on Windows
    runs-on: windows-latest
    # THE DEFAULT IS SIX HOURS, and this job's whole purpose is to exercise
    # loops, cancels and process trees - the things that hang. A green run
    # takes about fourteen minutes; a run that has been going for forty is not
    # slow, it is stuck, and six hours of a Windows runner to learn that is a
    # bad trade. Fail, and let the per-file timeouts below say which one.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: What this runner actually has
        shell: pwsh
        run: |
          "git      : $((Get-Command git -EA SilentlyContinue).Source)"
          "bash     : $((Get-Command bash -EA SilentlyContinue).Source)"
          "autocrlf : $(git config --get core.autocrlf)"
          foreach ($k in 'HKLM:\SOFTWARE\GitForWindows','HKLM:\SOFTWARE\WOW6432Node\GitForWindows') {
            try { "$k -> $((Get-ItemProperty $k -Name InstallPath -EA Stop).InstallPath)" }
            catch { "$k -> absent" }
          }

      # SIZE ON DISK vs SIZE IN THE BLOB, and not a grep, because on Git bash
      # the obvious grep lies: MSYS grep and MSYS shell redirection disagree
      # about text translation. A file rewritten to CRLF is longer than its
      # blob by exactly its line count, and neither `stat` nor a pipe does any
      # translation.
      - name: .gitattributes survived the checkout, so a Linux clone would work
        shell: bash
        run: |
          set -uo pipefail
          bad=0
          checked=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            checked=$((checked + 1))
            disk=$(stat -c %s "$f")
            blob=$(git cat-file blob "HEAD:$f" | wc -c | tr -d ' ')
            if [ "$disk" != "$blob" ]; then
              bad=$((bad + 1))
              lines=$(git cat-file blob "HEAD:$f" | wc -l | tr -d ' ')
              echo "  $f: $disk bytes on disk, $blob in the blob, difference $((disk - blob)) over $lines lines"
              echo "     attrs: $(git check-attr text eol -- "$f" | tr '\n' ' ')"
            fi
          done < <(git ls-files '*.sh' '*.ps1')
          echo "compared $checked files against their blobs"
          if [ "$checked" -eq 0 ]; then
            echo "::error::no files were compared, so this check verified nothing"
            exit 1
          fi
          if [ "$bad" -ne 0 ]; then
            echo "  core.autocrlf: $(git config --get core.autocrlf)"
            echo "::error::$bad file(s) differ in size from their blob, so eol=lf was not honoured"
            exit 1
          fi
          echo "every file is byte-identical to its blob, so eol=lf held against core.autocrlf=$(git config --get core.autocrlf)"

      - name: station.ps1 finds bash and hands over
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path tw | Out-Null
          bash ./station/bootstrap.sh tw 2>&1 | Out-Null
          Push-Location tw
          git init -q .
          git config user.email ci@example.invalid
          git config user.name ci
          $out = & powershell.exe -NoProfile -File .\station.ps1 --check 2>&1 | Out-String
          Pop-Location
          Write-Output $out
          if ($out -notmatch 'station\.ps1: using .*bash\.exe') {
            Write-Output "::error::station.ps1 did not report the bash it selected"; exit 1
          }
          foreach ($needle in 'sed -u', 'base64', 'line endings') {
            if ($out -notmatch [regex]::Escape($needle)) {
              Write-Output "::error::preflight did not report '$needle', so handover did not happen"; exit 1
            }
          }
          Write-Output "station.ps1 found bash and start.sh ran its preflight"
          # start.sh --check exits non-zero here ON PURPOSE: this throwaway
          # repo has no origin, so the credential and push checks cannot pass.
          Write-Output "start.sh --check exited $LASTEXITCODE, expected non-zero with no origin"
          exit 0

      - name: The CR-tolerant branch of the line-ending probe, which Linux cannot reach
        shell: bash
        run: |
          set +e
          set -uo pipefail
          cd tw
          out=$(./start.sh --check 2>&1 | grep -i 'line endings')
          echo "$out"
          case "$out" in
            *"tolerates CR"*) echo "took the tolerant branch, as Git for Windows should" ;;
            FAIL*) echo "::error::the preflight blocked on a Windows control node that works"; exit 1 ;;
            *) echo "::error::unexpected line-endings verdict: $out"; exit 1 ;;
          esac

      - name: A PowerShell step through the real capture, on Windows PowerShell
        shell: bash
        run: |
          set +e
          set -uo pipefail
          cd tw
          PUSH=0 ./run.sh win >/dev/null 2>&1; rc=$?
          log=$(ls -t ops-logs/win-*.txt 2>/dev/null | head -1)
          [ -n "$log" ] || { echo "::error::no log produced by the win step"; exit 1; }
          [ "$rc" = "0" ] || { echo "::error::win-snapshot reported failure ($rc)"; exit 1; }
          cr=$(tr -cd '\r' < "$log" | wc -c | tr -d ' ')
          esc=$(tr -cd '\033' < "$log" | wc -c | tr -d ' ')
          stamped=$(grep -cE '^[0-9]{2}:[0-9]{2}:[0-9]{2} \| ' "$log")
          echo "log=$log rc=$rc cr=$cr esc=$esc stamped=$stamped"
          [ "$cr"  = "0" ] || { echo "::error::$cr CR bytes reached the log"; exit 1; }
          [ "$esc" = "0" ] || { echo "::error::$esc ANSI bytes reached the log"; exit 1; }
          [ "$stamped" -gt 0 ] || { echo "::error::no timestamped lines in the log"; exit 1; }
          grep -q 'identity' "$log" || { echo "::error::the step's own output is missing"; exit 1; }

      - name: service.ps1 registers, reports and removes a scheduled task
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $env:HELIOGRAPH_SERVICE_NAME = 'heliograph-ci'
          Push-Location tw

          # No remote yet, so it must refuse: a loop that cannot push is the
          # expensive failure this check exists to prevent.
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\service.ps1 install 2>&1 | Out-String
          if ($out -notmatch 'no origin remote') {
            Write-Output $out
            Write-Output "::error::service.ps1 did not refuse to install without a remote"
            Pop-Location; exit 1
          }
          Write-Output "refused without a remote, correctly"

          git init -q --bare ..\origin.git
          git remote add origin ..\origin.git
          git add -A 2>&1 | Out-Null
          git commit -qm init 2>&1 | Out-Null
          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\service.ps1 install 2>&1 | Out-String
          Write-Output $out
          $task = Get-ScheduledTask -TaskName 'heliograph-ci' -ErrorAction SilentlyContinue
          if (-not $task) {
            Write-Output "::error::service.ps1 install did not register a scheduled task"
            Pop-Location; exit 1
          }
          Write-Output "registered, state=$($task.State)"

          # The setting that matters most: the default execution time limit is
          # three days, after which Windows stops the task and the loop
          # quietly ends. Zero means no limit.
          $limit = (Get-ScheduledTask -TaskName 'heliograph-ci').Settings.ExecutionTimeLimit
          Write-Output "ExecutionTimeLimit: [$limit]"
          if ($limit -and $limit -ne 'PT0S') {
            Write-Output "::error::the task has a time limit of $limit, so the loop would stop on its own"
            Pop-Location; exit 1
          }

          $out = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\service.ps1 status 2>&1 | Out-String
          if ($out -notmatch 'heliograph-ci') {
            Write-Output $out
            Write-Output "::error::status did not report the task"; Pop-Location; exit 1
          }

          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\service.ps1 uninstall 2>&1 | Out-String | Write-Output
          if (Get-ScheduledTask -TaskName 'heliograph-ci' -ErrorAction SilentlyContinue) {
            Write-Output "::error::uninstall left the task registered"; Pop-Location; exit 1
          }
          Write-Output "registered, reported and removed"
          Pop-Location

      # PLANTED AND DRIVEN WITH NOTHING BUT POWERSHELL, which is the entire
      # premise of this payload. Everything else in this job reaches for bash
      # at some point - even the steps that test PowerShell run the harness
      # under Git-Bash - so none of them can answer the question this estate
      # actually asks: does it work on a box where bash is not an option.
      #
      # bootstrap.ps1 plants it, station.ps1 runs one request, and the ASSERTION
      # IS THE FAR SIDE. The share transport is used because it needs nothing
      # but a directory; the question here is the platform, not the channel.
      - name: Planted and driven with PowerShell alone, no bash anywhere
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'psonly'
          $payload = Join-Path $work 'payload'
          $share = Join-Path $work 'share'
          New-Item -ItemType Directory -Force -Path (Join-Path $share 'ci') | Out-Null

          # Windows PowerShell 5.1, deliberately: the floor this targets, and
          # the edition a locked-down Server box actually has.
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
              -File .\station\bootstrap.ps1 $payload | Out-Null
          foreach ($f in 'station.ps1', 'run.ps1', 'start.ps1', 'caplib.psm1', 'transports\share.psm1') {
            if (-not (Test-Path (Join-Path $payload $f))) {
              Write-Output "::error::bootstrap.ps1 did not plant $f"; exit 1
            }
          }

          # -Encoding ascii, NOT utf8, and this is the trap this whole payload
          # exists to survive: Windows PowerShell 5.1's `Set-Content -Encoding
          # utf8` writes a BOM. A BOM is three invisible bytes in front of the
          # `# heliograph-mode:` line, so it stops being the first thing on its
          # line and run.ps1 refuses the step with exit 3 - correctly, and the
          # step would be blamed rather than the editor. Both files here are
          # pure ASCII, which is byte-identical to UTF-8 and carries no BOM on
          # either edition.
          Set-Content -Path (Join-Path $payload 'steps\ci-probe.ps1') -Encoding ascii -Value @(
            '# heliograph-mode: read-only'
            "Write-Output 'the evidence from a box with no bash'"
            'exit 3'
          )
          Set-Content -Path (Join-Path $share 'ci\request') -Encoding ascii -Value @(
            'id: ci-1'
            'step: ./steps/ci-probe.ps1'
          )

          $env:TRANSPORT = 'share'
          $env:SHARE_DIR = $share
          $env:SHARE_SCOPE = 'ci'
          # The runner is an Administrator, so gate 4 refuses every step unless
          # this says the estate has no other account. That gate has its own
          # assertions in tests/test-station-loop-ps1.sh, which do NOT set it.
          $env:ALLOW_ROOT = '1'
          Push-Location $payload
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
              -File .\station.ps1 --once --interval 1 2>&1 | Out-String | Write-Output
          Pop-Location

          $status = Get-Content (Join-Path $share 'ci\status') -Raw
          Write-Output "--- published status`n$status"
          foreach ($want in 'state:    idle', 'id:       ci-1', 'exit:     3') {
            if ($status -notmatch [regex]::Escape($want)) {
              Write-Output "::error::the published status does not say '$want'"; exit 1
            }
          }
          $logs = @(Get-ChildItem (Join-Path $share 'ci\ops-logs') -Filter *.txt -EA SilentlyContinue)
          if ($logs.Count -ne 1) {
            Write-Output "::error::expected one delivered log on the far side, found $($logs.Count)"; exit 1
          }
          $body = Get-Content $logs[0].FullName -Raw
          if ($body -notmatch 'the evidence from a box with no bash') {
            Write-Output "::error::the delivered log does not carry the step's own output"; exit 1
          }
          # A COMPLETE log, not a progress snapshot. Delivery ships a finished
          # log or it ships nothing, and a reader must never have to wonder
          # whether the file they are holding is the whole run.
          if ($body -notmatch 'finished UTC') {
            Write-Output "::error::the delivered log has no footer, so it is not a complete run"; exit 1
          }
          Write-Output "planted, polled, ran and delivered, with no bash involved"

      # THE VERBS test-service-ps1.sh CANNOT REACH. Register-ScheduledTask is
      # Windows-only, so that file tests the half that fails silently - the
      # configuration carriage - and skips the install verbs by name. This is
      # where they run.
      #
      # A SCHEDULED TASK IS NOT THE ASSERTION. That it exists proves nothing
      # about whether the loop it starts can deliver, which is the whole reason
      # this installer is more than a Register-ScheduledTask call. So this
      # installs, waits for the task to actually run the station, and reads the
      # FAR SIDE.
      - name: service.ps1 installs a PowerShell station that can actually deliver
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $work = Join-Path $env:RUNNER_TEMP 'psservice'
          $payload = Join-Path $work 'payload'
          $share = Join-Path $work 'share'
          New-Item -ItemType Directory -Force -Path (Join-Path $share 'svc') | Out-Null
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
              -File .\station\bootstrap.ps1 $payload | Out-Null

          Set-Content -Path (Join-Path $payload 'steps\svc-probe.ps1') -Encoding ascii -Value @(
            '# heliograph-mode: read-only'
            "Write-Output 'delivered by a scheduled task'"
          )
          Set-Content -Path (Join-Path $share 'svc\request') -Encoding ascii -Value @(
            'id: svc-ci-1'
            'step: ./steps/svc-probe.ps1'
          )

          $env:HELIOGRAPH_SERVICE_NAME = 'heliograph-ps-ci'
          $env:TRANSPORT = 'share'
          $env:SHARE_DIR = $share
          $env:SHARE_SCOPE = 'svc'
          # The runner is an Administrator, so gate 4 refuses every step without
          # this. It is CARRIED INTO THE TASK by the installer, which is part of
          # what is being tested.
          $env:ALLOW_ROOT = '1'
          # --once so the task finishes rather than polling for the rest of the job.
          Push-Location $payload
          & powershell.exe -NoProfile -ExecutionPolicy Bypass `
              -File .\service.ps1 install -- --once 2>&1 | Out-String | Write-Output

          $cfg = Join-Path $payload '.station-env-ps'
          if (-not (Test-Path $cfg)) { Write-Output '::error::no .station-env-ps was written'; Pop-Location; exit 1 }
          if ((Get-Content $cfg -Raw) -notmatch 'SHARE_SCOPE=svc') {
            Write-Output '::error::the config file did not carry SHARE_SCOPE'; Pop-Location; exit 1
          }

          $t = Get-ScheduledTask -TaskName 'heliograph-ps-ci' -ErrorAction SilentlyContinue
          if (-not $t) { Write-Output '::error::no scheduled task was registered'; Pop-Location; exit 1 }
          $lim = (Get-ScheduledTask -TaskName 'heliograph-ps-ci').Settings.ExecutionTimeLimit
          if ($lim -and $lim -ne 'PT0S') {
            Write-Output "::error::the task has a time limit of $lim, so the loop would stop on its own"
            Pop-Location; exit 1
          }
          # RESTART ON FAILURE IS NOT OPTIONAL HERE. A PowerShell station asks to
          # be restarted after a self-update by EXITING 75; without a restart
          # policy that stops the station instead of replacing it.
          $rc = (Get-ScheduledTask -TaskName 'heliograph-ps-ci').Settings.RestartCount
          if (-not $rc -or $rc -lt 1) {
            Write-Output '::error::the task has no restart policy, so an exit-75 self-update would stop it'
            Pop-Location; exit 1
          }

          # THE ASSERTION. A task that runs and a station that delivers are
          # different claims, and only the far side settles the second.
          #
          # WAITING FOR THE STATE, NOT FOR THE FILE. Waiting on Test-Path broke
          # on the first turn every time: the loop publishes `running` before it
          # starts the step, so the file exists within a second and the wait
          # ended while the run was still going. The assertion below then read
          # `running` and reported that the task had not delivered - about a
          # station that delivered four seconds later.
          #
          # The wait and the assertion now ask the same question. A wait whose
          # condition is weaker than the assertion it guards is not a wait.
          $statusFile = Join-Path $share 'svc\status'
          $deadline = (Get-Date).AddSeconds(180)
          while ((Get-Date) -lt $deadline) {
            $s = if (Test-Path $statusFile) { Get-Content $statusFile -Raw -EA SilentlyContinue } else { '' }
            if ($s -match 'state:\s*idle') { break }
            Start-Sleep -Seconds 3
          }
          $status = if (Test-Path $statusFile) { Get-Content $statusFile -Raw } else { '' }
          Write-Output "--- published status`n$status"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\service.ps1 status 2>&1 | Out-String | Write-Output
          # `\s*` rather than the four spaces the document happens to align to.
          # The assertion is about the state, and a column that moves is not a
          # reason for CI to fail.
          if ($status -notmatch 'state:\s*idle') {
            Write-Output '::error::the scheduled task did not run a station that delivered'
            Write-Output (Get-Content (Join-Path $payload '.station-service.log') -Raw -EA SilentlyContinue)
            Pop-Location; exit 1
          }
          $logs = @(Get-ChildItem (Join-Path $share 'svc\ops-logs') -Filter *.txt -EA SilentlyContinue)
          if ($logs.Count -ne 1) { Write-Output "::error::expected one delivered log, found $($logs.Count)"; Pop-Location; exit 1 }

          # AND UNINSTALL TAKES THE CREDENTIAL FILE WITH IT. Leaving one behind
          # after an uninstall is not tidying up.
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\service.ps1 uninstall 2>&1 | Out-String | Write-Output
          Pop-Location
          if (Get-ScheduledTask -TaskName 'heliograph-ps-ci' -ErrorAction SilentlyContinue) {
            Write-Output '::error::uninstall left the task registered'; exit 1
          }
          if (Test-Path $cfg) { Write-Output '::error::uninstall left .station-env-ps behind, and it may hold a token'; exit 1 }
          Write-Output 'installed, delivered through the task, and removed itself cleanly'

      # THE FLOOR, EXERCISED. Windows PowerShell 5.1 is what caplib.psm1
      # targets, and until this ran nothing had ever tested it: the driver
      # preferred pwsh, so on a runner with both editions the 5.1 path was
      # never taken. That is precisely how a first version shipped using
      # ProcessStartInfo.ArgumentList, which .NET Framework does not have and
      # which would have thrown on every real 5.1 station.
      #
      # Both editions, separately, because "it works on 7" says nothing about
      # the platform this exists for.
      - name: The capture passes conformance on Windows PowerShell 5.1 AND on 7
        shell: bash
        run: |
          set -uo pipefail
          # `set +e` IS LOAD-BEARING AND THE WHOLE STEP DEPENDED ON IT.
          #
          # GitHub runs `shell: bash` as `bash --noprofile --norc -e -o
          # pipefail {0}`. The `-e` is the runner's, not ours, and the
          # `set -uo pipefail` above does not clear it. So the first failing
          # pipeline killed the step outright and every `rc=1` guard below -
          # the entire design of this step - was unreachable.
          #
          # What that cost: a failure under `powershell` meant `pwsh` was never
          # run, while the step's own name said both had passed. Watched on
          # run 35191330707, which reported a single failed assertion under
          # 5.1 and contains no `--- pwsh` line and no `finished in` line at
          # all. PowerShell 7 had never actually been tested on any red run.
          # heliograph-cloud#265.
          #
          # `rc` is returned at the end, so a genuine failure still fails the
          # job. What changes is that BOTH editions are tried first, which is
          # exactly when the second one's result is most worth having.
          set +e
          rc=0
          for ps in powershell pwsh; do
            command -v "$ps" >/dev/null 2>&1 || {
              echo "::error::$ps is not on this runner, so that edition was NOT tested"; rc=1; continue; }
            echo "--- $ps"
            _t0=$SECONDS
            # Over the SHARE, which needs nothing but a directory. The git
            # transport is covered by the Linux sweep; here the question is the
            # interpreter, not the channel.
            CONF_PS_SHELL="$ps" CONF_TRANSPORT=share timeout 900 ./tests/conformance/conformance.sh \
              tests/conformance/drivers/powershell.sh 2>&1 | tee "/tmp/conf-$ps.out"
            [ "${PIPESTATUS[0]}" -eq 0 ] || { echo "::error::conformance failed under $ps"; rc=1; }
            # NOTHING MAY SKIP HERE ANY MORE, and the allowance that used to be
            # in this line is gone rather than left as a courtesy.
            #
            # It permitted p8, the cancel, because Git-Bash has no setsid and
            # the Job Object had not been written. Both of those stopped being
            # true: lib/cancel.psm1 ships a Job Object with taskkill behind it,
            # and the driver answers `cancel` on Windows. A permission that
            # outlives its reason is how a property drops out unnoticed - it
            # reads as a deliberate exemption for ever after.
            bad="$(grep '^SKIP' "/tmp/conf-$ps.out" || true)"
            [ -z "$bad" ] || { echo "::error::$ps skipped something it may not:"; echo "$bad"; rc=1; }
            for prop in p1 p2 p3 p4 p5 p6 p7 p8 p9 p10; do
              grep -qE "^ok +$prop:" "/tmp/conf-$ps.out" || {
                echo "::error::$ps did not answer $prop"; rc=1; }
            done
            grep -q "^--- conformance: caplib.psm1" "/tmp/conf-$ps.out" || {
              echo "::error::$ps did not report which interpreter it ran"; rc=1; }
            # run.ps1's gates under the same edition. The conformance suite
            # asks whether they fail closed; this asks the exact exit codes and
            # compares them against run.sh's, case by case.
            CONF_PS_SHELL="$ps" timeout 900 ./tests/test-run-ps1.sh 2>&1 | tee "/tmp/gates-$ps.out"
            [ "${PIPESTATUS[0]}" -eq 0 ] || { echo "::error::run.ps1 gates failed under $ps"; rc=1; }
            grep -q '^SKIP' "/tmp/gates-$ps.out" && {
              echo "::error::run.ps1's gates skipped under $ps"; rc=1; }
            # The preflight, and the cancel. THE CANCEL IS THE ONE THAT ONLY
            # WINDOWS CAN ANSWER: everywhere else it is a process group, and
            # here it is a Job Object with taskkill behind it. A grandchild
            # surviving is the defect, and only a real Windows tree shows it.
            CONF_PS_SHELL="$ps" timeout 900 ./tests/test-station-ps1.sh 2>&1 | tee "/tmp/pre-$ps.out"
            [ "${PIPESTATUS[0]}" -eq 0 ] || { echo "::error::the preflight or cancel failed under $ps"; rc=1; }
            # The transports: what they refuse, what they never say, and what
            # they do when a delivery fails. Property 9 cannot see the last one
            # - from the far side of a working channel, a delivery that
            # succeeded and one that lied look the same.
            CONF_PS_SHELL="$ps" timeout 900 ./tests/test-transports-ps1.sh 2>&1 | tee "/tmp/tp-$ps.out"
            [ "${PIPESTATUS[0]}" -eq 0 ] || { echo "::error::the transports failed under $ps"; rc=1; }
            # THE SEAL, AND THIS IS THE ONLY PLACE THE REAL QUESTION IS ASKED.
            #
            # lib/seal/ is C# compiled by Add-Type at run time. On Windows
            # PowerShell 5.1 that is the .NET Framework CodeDOM compiler, which
            # is C# 5 and has no Span<T>; on pwsh 7 it is Roslyn against .NET
            # 10, which accepts nearly anything. So a modern construct creeping
            # into that tree passes every Linux runner and every pwsh run, and
            # fails at Add-Type on the exact estate this payload exists for.
            #
            # tests/test-seal-ps1.sh also builds the tree as net48/LangVersion 5
            # where a dotnet SDK exists, which is what makes the same question
            # answerable before the push. This is the measurement rather than
            # the proxy.
            CONF_PS_SHELL="$ps" timeout 900 ./tests/test-seal-ps1.sh 2>&1 | tee "/tmp/seal-$ps.out"
            [ "${PIPESTATUS[0]}" -eq 0 ] || { echo "::error::the seal failed under $ps"; rc=1; }
            # The vectors are the whole point of that file, so a run that
            # skipped them is a run that proved nothing about the seal.
            grep -qF "produces what Go would have sealed, byte for byte" "/tmp/seal-$ps.out" || {
              echo "::error::$ps did not compare the seal against Go's own bytes"; rc=1; }
            grep -qF "three distinct sequence numbers" "/tmp/seal-$ps.out" || {
              echo "::error::$ps did not exercise a REPEATED delivery over the relay"; rc=1; }
            bad="$(grep '^SKIP' "/tmp/seal-$ps.out" | grep -v 'no dotnet SDK' || true)"
            [ -z "$bad" ] || { echo "::error::the seal skipped something it may not under $ps:"; echo "$bad"; rc=1; }
            # AND CONFORMANCE OVER THE RELAY, on this edition. The station side
            # has no binary at all; the control side of the harness opens the
            # delivery with Go. A byte of divergence between the two seals
            # returns nothing and p9 fails, which is the only way that
            # divergence is ever visible.
            if command -v go >/dev/null 2>&1 && command -v python3 >/dev/null 2>&1; then
              CONF_PS_SHELL="$ps" CONF_TRANSPORT=relay timeout 900 ./tests/conformance/conformance.sh \
                tests/conformance/drivers/powershell.sh 2>&1 | tee "/tmp/relay-$ps.out"
              [ "${PIPESTATUS[0]}" -eq 0 ] || { echo "::error::relay conformance failed under $ps"; rc=1; }
              grep -qE "^ok +p9:" "/tmp/relay-$ps.out" || {
                echo "::error::$ps did not deliver over the relay"; rc=1; }
            else
              echo "::error::no go or python3 on this runner, so the relay was NOT exercised under $ps"; rc=1
            fi
            # A SKIP HERE IS ALLOWED ONLY FOR THE LINK CASES, which need a
            # privilege or Developer Mode to construct. Everything else must
            # run: a transport check that quietly skipped would report a
            # refusal as proven on a runner that never built the thing.
            bad="$(grep '^SKIP' "/tmp/tp-$ps.out" | grep -v 'could not be created here' || true)"
            [ -z "$bad" ] || { echo "::error::the transports skipped something they may not under $ps:"; echo "$bad"; rc=1; }
            grep -q '^SKIP' "/tmp/pre-$ps.out" && {
              echo "::error::the preflight or cancel skipped under $ps"; rc=1; }
            # And it must have used a WINDOWS mechanism, not fallen through to
            # something that happens to work here. This greps the ASSERTION the
            # test prints, not the preflight table - the table is only echoed
            # on failure, so the first version of this check could never match
            # and failed a run in which every test had passed.
            grep -qE 'established a Job Object|fell back to taskkill' "/tmp/pre-$ps.out" || {
              echo "::error::$ps did not report which Windows cancel mechanism it used"; rc=1; }
            # THE LOOP, AND GATE 3. The conformance suite cannot ask about
            # either: it asks whether a CAPTURE is honest, and a loop is not a
            # capture. This asks the questions nobody can answer by reading a
            # log afterwards - whether a step ran at all, and whether the far
            # side was told why it did not.
            #
            # It has to run HERE, on Windows, rather than only on the Linux
            # sweep. The loop starts a child process and later has to kill its
            # whole tree, and that is a different mechanism on each platform:
            # a process group on Unix, taskkill or a Job Object here. A cancel
            # that publishes `cancelled` while the step carries on changing the
            # estate is the worst outcome available to this file, and only a
            # real Windows tree shows it.
            CONF_PS_SHELL="$ps" timeout 900 ./tests/test-service-ps1.sh 2>&1 | tee "/tmp/svc-$ps.out"
            [ "${PIPESTATUS[0]}" -eq 0 ] || { echo "::error::the service installer failed under $ps"; rc=1; }
            CONF_PS_SHELL="$ps" timeout 1200 ./tests/test-station-loop-ps1.sh 2>&1 | tee "/tmp/loop-$ps.out"
            [ "${PIPESTATUS[0]}" -eq 0 ] || { echo "::error::the loop or gate 3 failed under $ps"; rc=1; }
            bad="$(grep '^SKIP' "/tmp/loop-$ps.out" || true)"
            [ -z "$bad" ] || { echo "::error::the loop skipped something it may not under $ps:"; echo "$bad"; rc=1; }
            # The assertions that would be the most expensive to lose, named so
            # that a file which stopped containing them fails loudly rather
            # than reporting a smaller suite as a clean run.
            for want in 'gate 3: an action is refused' \
                        'gate 3: the same action RUNS' \
                        'a cancel publishes state cancelled' \
                        'the log STOPS GROWING' \
                        'a run whose delivery failed publishes undelivered' \
                        'station.ps1 and station.sh publish the same status keys'; do
              grep -qF "$want" "/tmp/loop-$ps.out" || {
                echo "::error::$ps did not run the assertion '$want'"; rc=1; }
            done
            echo "--- $ps finished in $((SECONDS - _t0))s"
          done
          exit $rc

      # ONLY THE FILES THE PER-EDITION LOOP DOES NOT ALREADY RUN.
      #
      # This list used to repeat five files that the step above runs TWICE each,
      # once per edition, refusing a skip both times - so a third run added no
      # signal and a third of the job's wall clock. With the loop suite in it,
      # the job went from fourteen minutes to over fifty and hit its own
      # timeout. Running a test more times is not the same as testing more.
      #
      # What is left is what genuinely has no per-edition coverage:
      # test-powershell.sh is the BASH station running a PowerShell step, and
      # test-remote.sh reaches a Windows host over SSH. Neither is about which
      # PowerShell edition the station itself runs under.
      - name: The suite's other Windows-relevant files, unskipped
        shell: bash
        run: |
          set +e
          set -uo pipefail
          rc=0
          for f in tests/test-powershell.sh tests/test-remote.sh; do
            echo "--- $f"
            timeout 900 ./$f 2>&1 | tee "/tmp/$(basename "$f").out"
            [ "${PIPESTATUS[0]}" -eq 0 ] || rc=1
            if grep -q '^SKIP' "/tmp/$(basename "$f").out"; then
              echo "::error::$f skipped an assertion on Windows, where it should not"; rc=1
            fi
          done
          exit $rc

  kubernetes:
    name: The manifest runs on a real cluster
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # station/bash/kubernetes/heliograph.yaml shipped for months with no
      # test, and no cluster had ever run it. This is what moves it from
      # "validated" to "proven" on the hosts page: a kind cluster, the
      # real manifest, and a station that clones a repo, runs a step and
      # pushes the log back.
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: heliograph-ci
          wait: 180s

      - name: Apply it and drive a run through it
        run: ./tests/test-kubernetes.sh 2>&1 | tee /tmp/k8s.out

      - name: It must not have skipped
        # A skipped host test is worse than a missing one: the table says
        # "proven" on the strength of a run that never happened.
        run: |
          if grep -q '^SKIP' /tmp/k8s.out; then
            echo "::error::the Kubernetes test skipped. Nothing was applied to any cluster."
            exit 1
          fi
          grep -qE '^test-kubernetes\.sh: [0-9]+ passed, 0 failed, 0 skipped$' /tmp/k8s.out || {
            echo "::error::test-kubernetes.sh did not report a clean run"; exit 1; }

  macos:
    name: launchd keeps a Mac control node alive
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # A Mac ships bash 3.2 - the last GPLv2 release, from 2007 - and the
      # station's preflight refuses it, correctly: it uses `declare -A` and
      # `${var^^}`, neither of which 3.2 has. So a Mac that runs a station has
      # a newer bash, and this runner must too, or the job below tests a
      # station that refuses to start.
      #
      # It went unnoticed for four runs because it does not LOOK like that.
      # launchd restarts a failing job, so a poll for "is a loop running" keeps
      # finding a pid, and only the timing of the restart decides whether the
      # run is green. The fix is in service.sh; this makes the runner able to
      # demonstrate it.
      - name: A Mac that runs a station has a bash 4 or newer
        run: |
          brew list bash >/dev/null 2>&1 || brew install bash
          "$(brew --prefix)/bin/bash" --version | head -1

      # There is no systemd on a Mac and the setsid fallback does not survive
      # a reboot. The assertion that earns this runner is that `stop: yes`
      # STICKS: KeepAlive/SuccessfulExit=false is a belief about somebody
      # else's software until a real launchd has proved it.
      - name: Load a real LaunchAgent and stop it
        run: ./tests/test-launchd.sh 2>&1 | tee /tmp/launchd.out

      - name: It must not have skipped
        run: |
          if grep -q '^SKIP' /tmp/launchd.out; then
            echo "::error::the launchd test skipped on a macOS runner, which should be impossible."
            exit 1
          fi
          grep -qE '^test-launchd\.sh: [0-9]+ passed, 0 failed, 0 skipped$' /tmp/launchd.out || {
            echo "::error::test-launchd.sh did not report a clean run"; exit 1; }

  ci-ok:
    name: Station OK
    runs-on: ubuntu-latest
    if: always()
    needs:
      - validate
      - installers
      - binary-install
      - station
      - tests
      - container
      - windows
      - powershell
      - kubernetes
      - macos
    steps:
      - name: Fail if any job did not succeed
        run: |
          results='${{ join(needs.*.result, ' ') }}'
          echo "job results: $results"
          for r in $results; do
            [ "$r" = "success" ] || { echo "::error::a job did not succeed"; exit 1; }
          done
