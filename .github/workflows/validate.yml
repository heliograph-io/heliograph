name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # THE ESTATE FLOOR, defined once in dbhq-uk/.github (dbhq-uk/.github#4), the
  # same call every DBHQ skill repository makes: SKILL.md frontmatter parses
  # as YAML and names its directory, plugin.json parses and carries no
  # version, skill paths are braced, every shell script passes bash -n and
  # shellcheck, ruff E9,F over the Python, and no em or en dashes in markdown.
  # The ruff step is the one this repository did not have: it found two
  # unused imports in the Azure Function. Pinned by SHA; Dependabot moves it.
  floor:
    uses: dbhq-uk/.github/.github/workflows/skill-floor.yml@af131df509f44eb9abfe8b37ad6299c11f496c5f # skill-floor-v1.0.0

  go:
    name: Go builds, vets and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The site's tests build the real site, and the build refuses a
          # shallow clone (its sitemap dates pages from git history). This
          # job failed on PR #43 on exactly that, one run after the site job
          # had been given full history.
          fetch-depth: 0

      # No `version` in plugin.json, on purpose (24 Sep 2026). Claude Code only
      # updates an installed plugin when this field changes, it was never bumped,
      # and marketplace installs sat on old code for weeks. With no version the
      # commit is the version, so every merge to main reaches users.
      - name: plugin.json carries no version
        run: jq -e 'has("version") | not' .claude-plugin/plugin.json > /dev/null

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::gofmt would change these files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: unit tests
        run: go test ./... -count=1

      - name: only the dependencies that were argued for
        # This repository had none, and the check that enforced it did its job:
        # it forced the argument before the first one arrived.
        #
        # golang.org/x/crypto is here for ChaCha20-Poly1305, which is the one
        # primitive the seal construction needs that the standard library does
        # not have. Everything else - X25519, HKDF, Ed25519, SHA-256 - is
        # stdlib. The alternative was AES-GCM, and it was rejected because Go's
        # software AES is not constant time on a machine without AES-NI, which
        # a station may well be.
        #
        # x/sys is x/crypto's own dependency, for CPU feature detection.
        #
        # Adding to this list needs a sentence in the PR saying what the
        # standard library could not do.
        #
        # Checked against what is actually LINKED, not the module graph.
        # `go list -m all` includes modules nothing imports - x/net, x/text and
        # x/term arrive as x/crypto's declared requirements without a single
        # byte of them reaching the binary - so gating on that reports
        # dependencies the product does not have.
        #
        # `vendor/golang.org/x/...` is excluded because it is the standard
        # library's OWN vendored copy, which crypto/tls uses. It is stdlib
        # wearing a confusing path, not something this repository chose.
        run: |
          set -euo pipefail
          allowed="golang.org/x/crypto golang.org/x/sys"
          bad=0
          # The module's own packages are read from `go.mod` rather than typed
          # here. The path was typed here until the transfer to
          # `heliograph-io`, and then this line and `go.mod:1` were two copies
          # of one fact: renaming the module made every own package look like
          # an undeclared dependency and this job failed on all of them at
          # once. Loud rather than silent, but still a second edit nobody
          # would predict from the first.
          self="$(go list -m)"
          while read -r pkg; do
            root="$(echo "$pkg" | cut -d/ -f1-3)"
            case " $allowed " in
              *" $root "*) ;;
              *) echo "::error::undeclared dependency linked into the binary: $pkg"; bad=1 ;;
            esac
          done < <(go list -deps ./... | grep '\.' | grep -v "^$self" | grep -v '^crypto/internal/' | grep -v '^vendor/')
          [ "$bad" = "0" ] || exit 1
          echo "linked dependencies: $allowed"

  e2e:
    name: The CLI drives a real station
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'

      # The station lives in this repository since the merge, so there is no
      # second checkout and nothing for the test to skip - but the non-skip
      # assertion stays: a silently skipped end-to-end test is the same shape
      # of problem as a green suite that checked nothing.
      #
      # ONE PER TRANSPORT THAT HAS BOTH HALVES, because a round trip over one
      # says nothing about another. Each is two implementations of a layout on
      # opposite sides of a gap nobody can reach, and a disagreement between
      # them is two sides that each work perfectly and never meet. The relay's
      # is the one that has earned it most: four defects surfaced within an
      # hour of it first running, and none of them errored anywhere.
      - name: the CLI drives a stock station, and all three bootstraps agree
        run: |
          out="$(go test ./cmd/heliograph/ -run 'TestCLIDrivesAStockStation|TestCLIDrivesAShareStation|TestCLIDrivesARelayStation|TestBootstrapsAgree|TestBootstrapBothPlantsTwoPayloads' -v -count=1)"
          echo "$out"
          if echo "$out" | grep -q -- '--- SKIP'; then
            echo "::error::the end-to-end test skipped instead of running."
            exit 1
          fi
          # THE SUBTESTS ARE NAMED, not just the parent. TestBootstrapsAgree is
          # a table over flavours, and a parent passes when its table is empty -
          # so naming only the parent would let the powershell payload drop out
          # of this check without a word.
          for want in CLIDrivesAStockStation CLIDrivesAShareStation CLIDrivesARelayStation \
                      BootstrapsAgree BootstrapsAgree/bash BootstrapsAgree/powershell \
                      BootstrapBothPlantsTwoPayloads; do
            echo "$out" | grep -q -- "--- PASS: Test$want" || {
              echo "::error::Test$want did not run. If it was renamed, rename it here too."
              exit 1
            }
          done
          # bootstrap.ps1 is the third planter and the only one that needs
          # neither the CLI nor bash, which is the whole premise of the
          # PowerShell payload. It logs a SKIP of its own where there is no
          # PowerShell; this runner has one, so a skip here means it stopped
          # being compared rather than that it could not be.
          if echo "$out" | grep -q 'no PowerShell here, so bootstrap.ps1 was NOT compared'; then
            echo "::error::bootstrap.ps1 was not compared against the other two planters."
            exit 1
          fi

      # THE DEPLOYED RELAY, on main only.
      #
      # Everything above is measured against a local double, which proves the
      # two halves agree and says nothing about the thing actually running at
      # heliograph-relay.dbhq.uk - its TLS, its custom domain, its Durable
      # Object routing, or whether the token it was configured with is still
      # the token we hold. Those fail independently of this repository, and
      # silently: the first anybody would know is a station that cannot reach
      # its relay.
      #
      # NOT ON PULL REQUESTS, because a PR from a fork gets no secrets and the
      # step would report a false negative for every contributor. It SKIPS
      # rather than fails without them, so a repository with no relay
      # configured is not broken by this.
      #
      # It touches a routing key no station can be named, so it collects
      # nothing anybody is waiting for - a GET on that API deletes what it
      # returns.
      - name: the deployed relay still answers this credential
        if: github.event_name == 'push'
        env:
          HELIOGRAPH_RELAY_URL: ${{ secrets.HELIOGRAPH_RELAY_URL }}
          HELIOGRAPH_RELAY_ESTATE: ${{ secrets.HELIOGRAPH_RELAY_ESTATE }}
          HELIOGRAPH_RELAY_TOKEN: ${{ secrets.HELIOGRAPH_RELAY_TOKEN }}
        run: |
          if [ -z "${HELIOGRAPH_RELAY_TOKEN:-}" ]; then
            echo "no relay credential configured for this repository - skipping"
            exit 0
          fi
          go test ./cmd/heliograph -run TestRelayReachesTheDeployedRelay -v -count=1

      - name: the docs agree with the station
        # The end-to-end test proves the two halves INTEROPERATE. This proves
        # they DESCRIBE each other correctly, which is a different failure.
        #
        # The MCP tool descriptions tell a model that an action needs
        # CONFIRM=yes and --allow-actions. A model follows that literally. If
        # the station ever spelled a gate differently, every such request would
        # be refused, the model would read the refusal as a fault, and it would
        # retry forever against a machine nobody here can reach.
        run: |
          set -euo pipefail
          out="$(go test ./cmd/heliograph/ -v -count=1 \
                   -run 'GateSpellingsMatchTheStation|WirePathsMatchTheStation|StatusStatesAreAllKnownHere|TheIDIsTheTrigger')"
          echo "$out"
          if echo "$out" | grep -q -- '--- SKIP'; then
            echo "::error::a coherence check skipped instead of running."
            exit 1
          fi
          # Four checks, named individually rather than counted loosely: a
          # renamed test that stops matching the -run pattern would otherwise
          # pass this step by not existing.
          for want in GateSpellingsMatchTheStation WirePathsMatchTheStation \
                      StatusStatesAreAllKnownHere TheIDIsTheTrigger; do
            echo "$out" | grep -q -- "--- PASS: Test$want" || {
              echo "::error::Test$want did not run. If it was renamed, rename it here too."
              exit 1
            }
          done

  reproducible:
    name: The release binaries build the same twice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'

      # THE CLAIM, MEASURED ON EVERY PULL REQUEST.
      #
      # "The binary in the path is the binary you can read" is worth nothing
      # asserted and everything demonstrated, and it breaks quietly: one flag,
      # one floating toolchain, one path baked into a binary, and every hash
      # this project publishes is a number nobody else can arrive at.
      #
      # THE SECOND BUILD IS FROM A COPY WITH NO .git AND A DIFFERENT PATH,
      # because those are the two things that actually broke it when it was
      # first measured on 2026-09-12. Same source in a git checkout and in a
      # tarball of that checkout gave 475be520... and 7a1ac692... - Go stamps
      # the commit in by default and omits it silently where there is no
      # repository, so the person verifying from the release tarball is the one
      # who would have found out.
      - name: two builds, one set of hashes
        run: |
          set -euo pipefail
          packaging/reproduce.sh v0.0.0-ci /tmp/one > /tmp/one.log
          mkdir -p /tmp/elsewhere
          tar -c --exclude=.git --exclude=dist . | tar -x -C /tmp/elsewhere
          ( cd /tmp/elsewhere && packaging/reproduce.sh v0.0.0-ci /tmp/two > /tmp/two.log )
          if ! diff /tmp/one/SHA256SUMS /tmp/two/SHA256SUMS; then
            echo "::error::the same source built twice produced different bytes. Whatever the docs say a stranger can reproduce, they cannot."
            exit 1
          fi
          cat /tmp/one/SHA256SUMS

  station-purity:
    name: The far side ships as source, and every binary is on the list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Everything under station/ ships to the far side, where "plain bash or
      # plain PowerShell, you can read it before you run it" is the entire
      # proposition.
      #
      # TWO EXCEPTIONS, BOTH AT THE TOP LEVEL AND BOTH NAMED. station/embed.go
      # exists so the binary can carry the payload, and station/embed_test.go
      # is its test - the one that refuses to let a release embed somebody's
      # local .terraform or a captured log. Neither is under bash/ or
      # powershell/, so neither is ever embedded or planted; a test cannot be a
      # dependency of the far side by construction.
      #
      # The rule stays deliberately blunt: named files, not a pattern. `*_test.go`
      # would let somebody add a test beside a payload and call it exempt.
      - name: the only Go under station/ is embed.go and its test
        run: |
          bad="$(find station -name '*.go' \
                   ! -path 'station/embed.go' ! -path 'station/embed_test.go')"
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "::error::Go source under station/ beyond embed.go and its test. A station payload is planted as source and read before it is run, so source is what it must be."
            exit 1
          fi
          echo "station/ carries no Go beyond embed.go and its test"

      # AND THE PART THAT WAS MISSING, WHICH IS THE PART THAT MATTERED.
      #
      # The step above passed while heliograph-seal - a compiled Go binary -
      # ran on the far side, because it is built from cmd/ and shipped as an
      # artefact rather than existing as Go source under station/. The check
      # was green and its message said "the far side never gets a binary
      # dependency", which was not true. A future contributor would have
      # trusted it: the loophole is a two-line diff, adding a directory to cmd/
      # and a reference to it in a transport script, and nothing here would
      # have said a word.
      #
      # So the list is the rule. A program under cmd/ whose name appears
      # anywhere under station/ has to be in station/FAR-SIDE-BINARIES, and
      # anything in that file that is no longer referenced has to come out - a
      # list that is allowed to be stale is a list nobody can rely on.
      #
      # cmd/heliograph is exempt and must be: it is the control binary, and its
      # name is the project's, so it appears in nearly every file under
      # station/ without a single one of them running it.
      #
      # WHAT THIS DOES NOT CATCH, stated because a check that overstates itself
      # is worse than no check: a station told to install a THIRD-PARTY binary
      # (age, jq, socat) is not caught here. CONTRIBUTING.md refuses those under
      # "A far-side dependency", and that one is enforced by review.
      - name: every far-side binary is on the visible list
        run: |
          set -uo pipefail
          list=station/FAR-SIDE-BINARIES
          [ -f "$list" ] || { echo "::error::$list is missing. It is the policy, not a note about it."; exit 1; }
          allowed="$(grep -vE '^\s*(#|$)' "$list" | awk '{print $1}' | sort -u)"
          echo "on the list: $(echo "$allowed" | tr '\n' ' ')"
          bad=0
          referenced=""
          for d in cmd/*/; do
            name="$(basename "$d")"
            [ "$name" = "heliograph" ] && continue
            grep -rqF -- "$name" station/ || continue
            referenced="$referenced $name"
            if ! echo "$allowed" | grep -qxF -- "$name"; then
              echo "::error::cmd/$name is referenced under station/ and is not in $list. Adding a binary to the far side is a deliberate edit to that list, with a reproducible build and a published checksum behind it - not a side effect of adding a directory to cmd/."
              bad=1
            fi
          done
          for name in $allowed; do
            case " $referenced " in
              *" $name "*) ;;
              *) echo "::error::$list names $name, which nothing under station/ references. A stale allowlist is one nobody can rely on."; bad=1 ;;
            esac
          done
          [ "$bad" = "0" ] || exit 1
          echo "far-side binaries referenced under station/:$referenced"

      # A compiled thing can also arrive by being committed. Nothing under
      # station/ is anything but text today, and a blob appearing there would
      # be a binary on the far side that never went near cmd/.
      - name: nothing under station/ is a binary
        run: |
          set -uo pipefail
          bad=0
          while IFS= read -r f; do
            [ -s "$f" ] || continue
            case "$(file -b --mime-encoding "$f")" in
              binary) echo "$f"; bad=1 ;;
            esac
          done < <(git ls-files station)
          if [ "$bad" != "0" ]; then
            echo "::error::a non-text file is committed under station/. The payload is planted as source so that an operator can read it before running it."
            exit 1
          fi
          echo "every tracked file under station/ is text"

  site:
    name: The site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The sitemap's lastmod is the last commit that touched each page.
          # A shallow clone would date every page today, so the build refuses
          # one; this is the remedy it names.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.1'
      - name: build
        run: go run ./cmd/heliograph-site
      - name: every page has all three renderings
        # HTML for people, .md for agents, and a line in llms.txt. A page
        # missing one of those is published to a reader who cannot see it.
        run: |
          set -euo pipefail
          for f in site/content/*.md; do
            slug="$(basename "$f" .md)"
            for want in "site/dist/$slug.html" "site/dist/$slug.md"; do
              [ -f "$want" ] || { echo "::error::missing $want"; exit 1; }
            done
            grep -q "/$slug.md" site/dist/llms.txt || {
              echo "::error::$slug is not in llms.txt"; exit 1; }
          done
          echo "every page has HTML, markdown and an llms.txt entry"
      - name: no code block leaked into a description
        # Summary once walked into a fence, and the result went into llms.txt -
        # the one place a wrong description is read by something that cannot
        # tell it is wrong.
        run: |
          if grep -qE '^\- \[.*\]\(.*\): (heliograph (init|send)|\$ )' site/dist/llms.txt; then
            echo "::error::a code block was rendered as a page description"
            exit 1
          fi
          echo "descriptions are prose"

  style:
    name: House style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # terraform is not on the runner by default, and the step that needs it
      # failed with "command not found" rather than anything about the config.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: no em dashes
        run: |
          if grep -rn "$(printf '\xe2\x80\x94')" --include='*.md' --include='*.go' . ; then
            echo "::error::Em dash found. House style is a plain hyphen."
            exit 1
          fi
          echo "No em dashes."

      - name: nothing secret is in this public repository
        # The whole argument for committing account ids, zone ids and the
        # deployment itself rests on nothing secret being here. An argument
        # nobody checks is a hope, so it is checked.
        run: |
          set -uo pipefail
          bad=0
          # Credential shapes, by the prefixes vendors publish so that scanners
          # can spot them. Not a guarantee, a floor.
          # Matches outside the baseline. A baseline rather than a mute: these
          # fixtures exist to prove that redaction and the plant instructions
          # work, so they must stay readable, while anything NEW fails.
          hits="$(grep -rInE "(ghp_|github_pat_|glpat-|xox[abposr]-|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,})" \
                    --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist \
                    --exclude=.secret-scan-allow . || true)"
          unexpected=0
          while IFS= read -r hit; do
            [ -n "$hit" ] || continue
            file="${hit%%:*}"
            grep -q "^${file#./}:" .secret-scan-allow || { echo "UNEXPECTED: $hit"; unexpected=1; }
          done <<< "$hits"
          if [ "$unexpected" = "1" ]; then
            echo "::error::a credential shape appears in a file that is not in .secret-scan-allow"
            bad=1
          fi
          # Cloudflare API tokens are 40 characters of [A-Za-z0-9_-] with no
          # prefix, so they cannot be caught by shape. What CAN be caught is the
          # variable being assigned a long literal.
          #
          # The pattern deliberately does not try to match a quote character.
          # The first version did, and the nested escaping needed to put both
          # quote kinds inside a double-quoted YAML scalar produced a shell
          # SYNTAX error - which exits 2, fails the step, and says nothing about
          # secrets at all. A gate too clever to parse is a gate that is red for
          # the wrong reason.
          lit="$(grep -rInE "(CLOUDFLARE_API_TOKEN|TF_VAR_cloudflare_api_token)[[:space:]]*=[[:space:]]*.?[A-Za-z0-9_-]{25,}" \
                   --exclude-dir=.git --exclude-dir=node_modules . || true)"
          if [ -n "$lit" ]; then
            echo "$lit"
            echo "::error::an API token appears to be assigned a literal value"
            bad=1
          fi
          # State, which is the real risk and the one people forget.
          #
          # `|| true` on every grep, because the step runs under `bash -e` and a
          # grep that matches NOTHING exits 1. Without it this gate failed
          # precisely when the repository was clean, which is the worst
          # direction for a check to fail in: it trains people to ignore it.
          state="$(git ls-files | grep -E "\.tfstate|\.tfvars$|\.terraform/" || true)"
          if [ -n "$state" ]; then
            echo "$state"
            echo "::error::terraform state or variables are tracked. State holds secret values verbatim."
            bad=1
          fi
          keys="$(grep -rIn "BEGIN [A-Z ]*PRIVATE KEY" --exclude-dir=.git . || true)"
          if [ -n "$keys" ]; then
            echo "$keys"
            echo "::error::a private key is present"
            bad=1
          fi
          [ "$bad" = "0" ] || exit 1
          echo "no credential shapes, no state, no private keys"

      - name: terraform is valid and formatted
        run: |
          terraform -chdir=infra fmt -check -diff
          terraform -chdir=infra init -backend=false >/dev/null
          terraform -chdir=infra validate

      # THE STATION'S OWN TEMPLATES, WHICH NOTHING CHECKED.
      #
      # `infra/` has been validated since it existed. station/bash/azure/ - the
      # five templates the documentation calls deployed - had never been through
      # `terraform validate` or `bicep build` in CI at all, so an edit to any of
      # them shipped unverified. They are what somebody runs against an estate
      # they cannot easily debug, which is the worst place for that.
      #
      # `-backend=false`, so no state and no credentials are needed: this asks
      # whether the configuration is well formed, not whether it deploys.
      - name: the station's Azure templates are valid and formatted
        run: |
          set -euo pipefail
          terraform fmt -check -diff -recursive station/bash/azure
          n=0
          for d in station/bash/azure/*/; do
            [ -f "$d/main.tf" ] || continue
            n=$((n + 1))
            echo "--- $d"
            terraform -chdir="$d" init -backend=false -input=false >/dev/null
            terraform -chdir="$d" validate
          done
          [ "$n" -gt 0 ] || { echo "::error::no templates were validated, so this checked nothing"; exit 1; }
          echo "$n terraform template(s) validated"

      # AND THE REFUSALS ARE RUN, which `validate` never does: it checks that a
      # configuration is well formed, not what it does with values. `plan`
      # would, and it needs a subscription - these templates read a real subnet
      # and a real service plan before they reach the resource.
      #
      # `mock_provider` is what makes a precondition testable at all. A
      # precondition nobody has watched fail is a precondition nobody knows
      # works, and every one of these was written because the thing it refuses
      # would otherwise deploy and then exit 2, or be rejected by Azure halfway
      # through creating a resource group's worth of things.
      - name: the templates refuse what they say they refuse
        run: |
          set -euo pipefail
          n=0
          for f in station/bash/azure/*/main.tftest.hcl; do
            [ -f "$f" ] || continue
            d="$(dirname "$f")"
            n=$((n + 1))
            echo "--- $d"
            terraform -chdir="$d" test
          done
          [ "$n" -gt 0 ] || { echo "::error::no template tests ran, so this checked nothing"; exit 1; }
          echo "$n template test file(s) ran"

      # bicep is a SECOND implementation of each template, and two
      # implementations of one deployment is exactly the drift this repository
      # keeps paying for. `az bicep build` is the only thing that reads them.
      #
      # WARNINGS ARE FAILURES HERE. The linter's no-unused-params is how a
      # parameter added to the bicep and never wired into the resource gets
      # noticed - which is precisely the mistake made while writing this, twice.
      - name: the station's bicep templates build, warnings included
        run: |
          set -uo pipefail
          az bicep install >/dev/null 2>&1 || true
          bad=0; n=0
          for f in station/bash/azure/*/main.bicep; do
            [ -f "$f" ] || continue
            n=$((n + 1))
            out="$(az bicep build --file "$f" --stdout 2>&1 >/dev/null)"
            if [ -n "$out" ]; then
              echo "$out"
              echo "::error::$f does not build cleanly"
              bad=1
            else
              echo "ok $f"
            fi
          done
          [ "$n" -gt 0 ] || { echo "::error::no bicep templates were built, so this checked nothing"; exit 1; }
          [ "$bad" = "0" ] || exit 1
          echo "$n bicep template(s) built with no warnings"

      - name: the specs are still there
        # They are the only thing in this repository that is finished, and a
        # PR that removes one should have to say so out loud.
