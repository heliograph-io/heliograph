# =============================================================================
#  heliograph on a Kubernetes cluster the estate already runs
# =============================================================================
#  kubectl apply -f heliograph.yaml
#
#  No new infrastructure. If the estate already runs Kubernetes, this is one
#  pod on nodes they are already paying for, and the cluster has already solved
#  the problems that bite the other hosts: egress is configured, secrets have a
#  home, and `kubectl logs` works.
#
#  That last point matters more than it sounds. A crash-looping container group
#  in a VNet-injected ACI returns no logs at all, so debugging it means
#  reproducing the failure somewhere else. Here you just read them.
#
#  NO SERVICE AND NO INGRESS. The agent only ever makes outbound connections.
#  Nothing needs to reach it, so nothing is exposed.
#
#  THE CHECKOUT IS TRANSIENT. No PersistentVolumeClaim. Git is the persistence:
#  a log exists on local disk only for the seconds between the capture
#  finishing and the push landing. If the pod is rescheduled, run the step
#  again.
#
#  BEFORE YOU APPLY THIS, create the token secret:
#
#    kubectl create secret generic heliograph-git \
#      --from-literal=token='<a scoped, short-lived token>'
#
#  Or better, if the cluster has the Azure Key Vault CSI driver or workload
#  identity, use that instead and delete the env entry below. A Kubernetes
#  Secret is base64, not encryption, and anyone who can read secrets in this
#  namespace can read the token.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heliograph
  labels:
    app: heliograph
spec:
  replicas: 1
  # Recreate, not RollingUpdate. Two agents on one transport repo would both
  # answer the same request and race on the push. station.sh already refuses to
  # run twice on one checkout with a lock file; this is the same rule at the
  # cluster level.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: heliograph
  template:
    metadata:
      labels:
        app: heliograph
    spec:
      # The image runs as uid 1000 and needs no root. Say so explicitly, since
      # a cluster with a restrictive PodSecurity policy will otherwise ask.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: agent
          image: ghcr.io/heliograph-io/heliograph-toolkit:0.4.3
          env:
            # --- git, the default -------------------------------------------
            - name: REPO_URL
              value: "https://github.com/YOUR-ORG/YOUR-TRANSPORT-REPO.git"
            # GitHub wants x-access-token here. GitLab wants oauth2. Azure
            # DevOps wants it empty. Getting this wrong does not look like an
            # auth error: git reports "could not read Username".
            - name: GIT_TOKEN_USER
              value: "x-access-token"
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: heliograph-git
                  key: token

            # --- ANOTHER TRANSPORT ------------------------------------------
            # For a cluster that cannot reach a git host at all. Delete the four
            # entries above - INCLUDING REPO_URL, which the entrypoint refuses
            # alongside a non-git TRANSPORT rather than ignoring - and use one of
            # these. The image carries the station payload, so there is nothing
            # to clone.
            #
            # A FILE SHARE needs a volume and nothing else. Uncomment the
            # matching volume and volumeMount at the foot of this file too:
            #
            # - name: TRANSPORT
            #   value: "share"
            # - name: SHARE_DIR
            #   value: "/mnt/ops"
            # - name: SHARE_SCOPE
            #   value: "dns-timeouts"
            #
            # THE RELAY. The image carries heliograph-seal - the one transport
            # that needs a binary - and the entrypoint points the station at it.
            # What is left is the two key files and a token, and those are
            # yours, so they are Secrets you create.
            #
            # THE ORDER MATTERS, because the station's identity does not exist
            # until the station makes it. Both Secrets must exist before this
            # pod starts:
            #
            #   # on the control node
            #   heliograph init payments --transport relay \
            #     --dir https://relay.example.com --relay-estate payments --scope db-a
            #   heliograph plant -e payments      # prints the CONTROL public line
            #
            #   # anywhere with heliograph-seal - your laptop will do; this is
            #   # the station's own key and its secret half never leaves here
            #   heliograph-seal keygen --out ./identity
            #   heliograph-seal public --identity ./identity > ./public
            #   printf '%s' '<the control public line from plant>' > ./peer
            #
            #   kubectl create secret generic heliograph-relay-keys \
            #     --from-file=identity=./identity --from-file=peer=./peer
            #   kubectl create secret generic heliograph-relay \
            #     --from-literal=token='<the STATION token>'
            #
            #   # back on the control node, close the exchange
            #   heliograph relay peer -e payments "$(cat ./public)"
            #   # then COMPARE THE FINGERPRINTS by voice. Nothing else here
            #   # stops a relay substituting its own key.
            #
            # - name: TRANSPORT
            #   value: "relay"
            # - name: RELAY_URL
            #   value: "https://relay.example.com"
            # - name: RELAY_ESTATE
            #   value: "payments"
            # - name: RELAY_STATION
            #   value: "db-a"
            # - name: RELAY_IDENTITY
            #   value: "/etc/heliograph/identity"
            # - name: RELAY_PEER
            #   value: "/etc/heliograph/peer"
            # - name: RELAY_TOKEN
            #   valueFrom:
            #     secretKeyRef:
            #       name: heliograph-relay
            #       key: token
            # # Optional, and the pin worth having: the checksum published
            # # beside the release as heliograph-seal-linux-<arch>. Without it
            # # the entrypoint offers the image's own record, which proves only
            # # that the binary has not changed since the image was built.
            # - name: RELAY_SEAL_SHA256
            #   value: "<from SHA256SUMS in the release>"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              # The agent itself is a polling loop and needs almost nothing.
              # Raise this if your STEPS need it: a terraform plan against a
              # large estate will want considerably more.
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            # The clone, or the planted payload, has to land somewhere.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]

          # --- with TRANSPORT=share or relay, uncomment what you need --------
          # volumeMounts:
          #   - name: ops-share
          #     mountPath: /mnt/ops
          #   - name: relay-keys
          #     mountPath: /etc/heliograph
          #     readOnly: true


      # --- with TRANSPORT=share ---------------------------------------------
      # The share is whatever both sides mount. An NFS export and a PVC are the
      # two ordinary shapes; the station cares only that the path is there and
      # writable, and `./start.sh --check` proves that before anything runs.
      #
      # volumes:
      #   - name: ops-share
      #     persistentVolumeClaim:
      #       claimName: heliograph-ops-share
      #   - name: relay-keys
      #     secret:
      #       # Created by hand, before this pod starts - see the commands in
      #       # the env block above. `heliograph plant` prints the CONTROL
      #       # side's public line only; the station's own identity does not
      #       # exist until somebody runs keygen for it.
      #       secretName: heliograph-relay-keys
      #       items:
      #         - key: identity
      #           path: identity
      #         - key: peer
      #           path: peer
      #       defaultMode: 0400
